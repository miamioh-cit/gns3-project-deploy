</style>

  <!-- ========================================================= -->
  <!-- JAVASCRIPT -->
  <!-- ========================================================= -->
<script>
  const trafficZones = {
    i75: { name: "I-75", loopTag: "LOOP-101" },
    us35: { name: "US-35", loopTag: "LOOP-201" },
    sr48: { name: "SR-48", loopTag: "LOOP-301" },
    downtown: { name: "DOWNTOWN", loopTag: "LOOP-401" }
  };

  /*
   * Each direction has its OWN physical lane.
   * This is important: northbound and southbound must never share
   * the same x coordinate, and eastbound/westbound must never share
   * the same y coordinate. That prevents head-on collisions.
   */
  const laneGeometry = {
    /* Northbound: right/east lane when looking north. */
    north: { axis: "vertical", fixed: 223, start: 315, stop: 232, end: -35, sign: -1 },

    /* Southbound: left/west lane when looking north. */
    south: { axis: "vertical", fixed: 147, start: 35, stop: 113, end: 335, sign: 1 },

    /* Eastbound: right/south lane when looking east. */
    east: { axis: "horizontal", fixed: 210, start: -35, stop: 122, end: 405, sign: 1 },

    /* Westbound: left/north lane when looking east. */
    west: { axis: "horizontal", fixed: 135, start: 405, stop: 248, end: -35, sign: -1 }
  };

  const MAX_CARS = 16;
  const MIN_GAP = 24;
  const COMFORT_GAP = 34;
  const STOP_BUFFER = 4;

  const zoneState = {};

  Object.keys(trafficZones).forEach(zone => {
    zoneState[zone] = {
      cycleStart: Date.now() - Math.floor(Math.random() * 15000),
      phaseOffset: Math.floor(Math.random() * 15000),
      cycleLength: 30000,
      demand: Math.floor(Math.random() * 6) + 3,
      lastDemandChange: Date.now(),
      lastSpawn: 0,
      spawnInterval: 650 + Math.random() * 1000,
      cars: []
    };
  });

  function getNumericSensorValue(tag) {
    const element = document.getElementById("val-" + tag);
    if (!element) return null;

    const raw = element.textContent.trim();
    if (!raw || raw === "—") return null;

    const value = parseFloat(raw);
    return Number.isFinite(value) ? value : null;
  }

  function getTrafficDemand(zone) {
    const liveValue = getNumericSensorValue(trafficZones[zone].loopTag);

    if (liveValue !== null) {
      return Math.max(2, Math.min(MAX_CARS, Math.round(liveValue)));
    }

    return zoneState[zone].demand;
  }

  function updateDemand(zone) {
    const state = zoneState[zone];
    const now = Date.now();

    if (now - state.lastDemandChange < 5000) return;
    state.lastDemandChange = now;

    const change = Math.floor(Math.random() * 5) - 2;
    state.demand = Math.max(2, Math.min(12, state.demand + change));
  }

  function getPhase(zone) {
    const state = zoneState[zone];
    const elapsed = (
      Date.now() - state.cycleStart + state.phaseOffset
    ) % state.cycleLength;

    if (elapsed < 12000) return "green-ns";
    if (elapsed < 15000) return "yellow-ns";
    if (elapsed < 27000) return "green-ew";
    return "yellow-ew";
  }

  function directionAllowed(zone, direction, distance) {
    /* Once inside the intersection, never stop the car there. */
    const lane = laneGeometry[direction];
    const stopDistance = Math.abs(lane.stop - lane.start);

    if (distance >= stopDistance + STOP_BUFFER) return true;

    const phase = getPhase(zone);

    if (phase === "green-ns" || phase === "yellow-ns") {
      return direction === "north" || direction === "south";
    }

    return direction === "east" || direction === "west";
  }

  function setLight(zone, direction, color) {
    ["red", "yellow", "green"].forEach(lightColor => {
      const element = document.getElementById(
        "light-" + zone + "-" + direction + "-" + lightColor
      );

      if (!element) return;

      element.classList.remove(
        "signal-red",
        "signal-yellow",
        "signal-green",
        "signal-off"
      );

      element.classList.add(
        lightColor === color ? "signal-" + color : "signal-off"
      );
    });
  }

  function updateSignals(zone) {
    const phase = getPhase(zone);

    if (phase === "green-ns") {
      setLight(zone, "north", "green");
      setLight(zone, "south", "green");
      setLight(zone, "east", "red");
      setLight(zone, "west", "red");
    } else if (phase === "yellow-ns") {
      setLight(zone, "north", "yellow");
      setLight(zone, "south", "yellow");
      setLight(zone, "east", "red");
      setLight(zone, "west", "red");
    } else if (phase === "green-ew") {
      setLight(zone, "north", "red");
      setLight(zone, "south", "red");
      setLight(zone, "east", "green");
      setLight(zone, "west", "green");
    } else {
      setLight(zone, "north", "red");
      setLight(zone, "south", "red");
      setLight(zone, "east", "yellow");
      setLight(zone, "west", "yellow");
    }
  }

  function randomCarColor() {
    const colors = [
      "#60a5fa",
      "#f97316",
      "#e5e7eb",
      "#a78bfa",
      "#f43f5e",
      "#34d399"
    ];

    return colors[Math.floor(Math.random() * colors.length)];
  }

  function carPosition(car) {
    const lane = laneGeometry[car.direction];

    let position;

    if (lane.axis === "vertical") {
      position = {
        x: lane.fixed,
        y: lane.start + lane.sign * car.distance
      };
    } else {
      position = {
        x: lane.start + lane.sign * car.distance,
        y: lane.fixed
      };
    }

    return position;
  }

  function updateCarElement(car) {
    const position = carPosition(car);
    car.element.setAttribute("x", position.x);
    car.element.setAttribute("y", position.y);
  }

  function createCar(zone, direction) {
    const state = zoneState[zone];
    const group = document.getElementById("cars-" + zone);
    if (!group) return null;

    const car = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "rect"
    );

    car.setAttribute("class", "car");
    car.setAttribute(
      "width",
      direction === "north" || direction === "south" ? "9" : "18"
    );
    car.setAttribute(
      "height",
      direction === "north" || direction === "south" ? "18" : "9"
    );
    car.setAttribute("fill", randomCarColor());

    group.appendChild(car);

    const carState = {
      element: car,
      direction,
      distance: 0,
      speed: 42 + Math.random() * 18,
      id: Math.random().toString(36).slice(2)
    };

    state.cars.push(carState);
    updateCarElement(carState);

    return carState;
  }

  function laneHasEntrySpace(zone, direction) {
    const sameLaneCars = zoneState[zone].cars.filter(
      car => car.direction === direction
    );

    return !sameLaneCars.some(car => car.distance < 38);
  }

  function spawnTraffic(zone) {
    const state = zoneState[zone];
    const desired = Math.min(MAX_CARS, getTrafficDemand(zone));

    if (state.cars.length >= desired) return;

    const now = Date.now();
    if (now - state.lastSpawn < state.spawnInterval) return;

    state.lastSpawn = now;

    const directions = ["north", "south", "east", "west"];

    /* Prefer traffic on the currently active axis, but don't force it. */
    const phase = getPhase(zone);
    let pool;

    if (phase === "green-ns" || phase === "yellow-ns") {
      pool = ["north", "south", "east", "west"];
    } else {
      pool = ["east", "west", "north", "south"];
    }

    for (let attempt = 0; attempt < 10; attempt++) {
      const direction = pool[Math.floor(Math.random() * pool.length)];

      if (laneHasEntrySpace(zone, direction)) {
        createCar(zone, direction);
        state.spawnInterval = 600 + Math.random() * 1100;
        return;
      }
    }
  }

  function getCarAhead(zone, car) {
    let closest = null;
    let closestGap = Infinity;

    for (const other of zoneState[zone].cars) {
      if (other === car) continue;
      if (other.direction !== car.direction) continue;

      /* Same direction = same physical lane. */
      if (other.distance <= car.distance) continue;

      const gap = other.distance - car.distance;

      if (gap < closestGap) {
        closest = other;
        closestGap = gap;
      }
    }

    return closest;
  }

  function updateCars(zone, deltaSeconds) {
    const state = zoneState[zone];

    for (const car of state.cars) {
      let speed = car.speed;
      const phase = getPhase(zone);
      const lane = laneGeometry[car.direction];
      const stopDistance = Math.abs(lane.stop - lane.start);

      /* Slow down naturally on yellow. */
      if (phase === "yellow-ns" || phase === "yellow-ew") {
        speed *= 0.70;
      }

      /* Follow the car immediately ahead. */
      const ahead = getCarAhead(zone, car);

      if (ahead) {
        const gap = ahead.distance - car.distance;

        if (gap <= MIN_GAP) {
          speed = 0;
        } else if (gap < COMFORT_GAP) {
          speed = Math.min(speed, 12);
        }
      }

      /* Stop only while approaching a red light. */
      const canMove = directionAllowed(
        zone,
        car.direction,
        car.distance
      );

      if (!canMove && car.distance < stopDistance) {
        const gapToStop = stopDistance - car.distance;

        if (gapToStop <= 2) {
          speed = 0;
          car.distance = stopDistance;
        } else if (gapToStop < 28) {
          speed = Math.min(speed, Math.max(4, gapToStop * 1.8));
        }
      }

      /* Move. */
      car.distance += speed * deltaSeconds;

      /* Hard safety clamp before a red signal. */
      if (!canMove && car.distance > stopDistance) {
        car.distance = stopDistance;
      }

      updateCarElement(car);
    }

    /* Remove cars that have completely left the intersection. */
    state.cars = state.cars.filter(car => {
      const lane = laneGeometry[car.direction];
      const exitDistance = Math.abs(lane.end - lane.start);

      if (car.distance > exitDistance) {
        car.element.remove();
        return false;
      }

      return true;
    });
  }

  function updateMessages(zone) {
    const demand = getTrafficDemand(zone);
    const phase = getPhase(zone);

    let direction = "EAST / WEST";

    if (phase === "green-ns" || phase === "yellow-ns") {
      direction = "NORTH / SOUTH";
    }

    let trafficLevel = "NORMAL TRAFFIC";

    if (demand >= 8) {
      trafficLevel = "HEAVY TRAFFIC";
    } else if (demand >= 5) {
      trafficLevel = "MODERATE TRAFFIC";
    }

    const message = document.getElementById("message-" + zone);
    if (message) {
      message.textContent =
        "VMS: " + trafficLevel + " — " + direction;
    }

    const status = document.getElementById("status-" + zone);
    if (status) {
      status.textContent =
        direction +
        " ACTIVE — " +
        zoneState[zone].cars.length +
        " VEHICLES ON ROAD";
    }

    const operations = document.getElementById("ops-" + zone);
    if (operations) {
      operations.textContent =
        trafficZones[zone].name +
        ": " +
        zoneState[zone].cars.length +
        " VEHICLES / " +
        direction;
    }
  }

  let lastFrame = performance.now();

  function animate(now) {
    const deltaSeconds = Math.min(
      0.05,
      (now - lastFrame) / 1000
    );

    lastFrame = now;

    Object.keys(trafficZones).forEach(zone => {
      updateDemand(zone);
      updateSignals(zone);
      spawnTraffic(zone);
      updateCars(zone, deltaSeconds);
      updateMessages(zone);
    });

    const update = document.getElementById("last-update");

    if (update) {
      update.textContent =
        "Last update: " +
        new Date().toLocaleTimeString();
    }

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
</script>
</svg>
