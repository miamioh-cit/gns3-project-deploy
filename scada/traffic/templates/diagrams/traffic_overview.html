<script>
  const trafficZones = {
    i75: { name: "I-75", loopTag: "LOOP-101" },
    us35: { name: "US-35", loopTag: "LOOP-201" },
    sr48: { name: "SR-48", loopTag: "LOOP-301" },
    downtown: { name: "DOWNTOWN", loopTag: "LOOP-401" }
  };

  /*
   * Each direction has its OWN physical lane.
   * This is important: northbound and southbound must never share
   * the same x coordinate, and eastbound/westbound must never share
   * the same y coordinate. That prevents head-on collisions.
   */
  const laneGeometry = {
    /*
     * Coordinates follow right-hand traffic:
     * Northbound = east/right lane.
     * Southbound = west/left lane.
     * Eastbound  = south/bottom lane.
     * Westbound  = north/top lane.
     *
     * entry/exit are measured along each lane's distance axis.
     */
    north: {
      axis: "vertical",
      fixed: 223,
      start: 315,
      stopDistance: 88,
      intersectionEntry: 90,
      intersectionExit: 195,
      end: 350,
      sign: -1
    },

    south: {
      axis: "vertical",
      fixed: 147,
      start: 35,
      stopDistance: 78,
      intersectionEntry: 85,
      intersectionExit: 190,
      end: 335,
      sign: 1
    },

    east: {
      axis: "horizontal",
      fixed: 210,
      start: -35,
      stopDistance: 157,
      intersectionEntry: 167,
      intersectionExit: 273,
      end: 440,
      sign: 1
    },

    west: {
      axis: "horizontal",
      fixed: 135,
      start: 405,
      stopDistance: 157,
      intersectionEntry: 167,
      intersectionExit: 273,
      end: 440,
      sign: -1
    }
  };

  const MAX_CARS = 16;
  const MIN_GAP = 24;
  const COMFORT_GAP = 34;
  const STOP_BUFFER = 4;

  const zoneState = {};

  Object.keys(trafficZones).forEach(zone => {
    zoneState[zone] = {
      cycleStart: Date.now() - Math.floor(Math.random() * 15000),
      phaseOffset: Math.floor(Math.random() * 15000),
      cycleLength: 30000,
      demand: Math.floor(Math.random() * 6) + 3,
      lastDemandChange: Date.now(),
      lastSpawn: 0,
      spawnInterval: 650 + Math.random() * 1000,
      cars: []
    };
  });

  function getNumericSensorValue(tag) {
    const element = document.getElementById("val-" + tag);
    if (!element) return null;

    const raw = element.textContent.trim();
    if (!raw || raw === "—") return null;

    const value = parseFloat(raw);
    return Number.isFinite(value) ? value : null;
  }

  function getTrafficDemand(zone) {
    const liveValue = getNumericSensorValue(trafficZones[zone].loopTag);

    if (liveValue !== null) {
      return Math.max(2, Math.min(MAX_CARS, Math.round(liveValue)));
    }

    return zoneState[zone].demand;
  }

  function updateDemand(zone) {
    const state = zoneState[zone];
    const now = Date.now();

    if (now - state.lastDemandChange < 5000) return;
    state.lastDema  function getIntersectionBounds(direction) {
    const lane = laneGeometry[direction];
    return {
      entry: lane.intersectionEntry,
      exit: lane.intersectionExit,
      stop: Math.max(0, lane.stopDistance)
    };
  }

  function isInsideIntersection(car) {
    const bounds = getIntersectionBounds(car.direction);
    return car.distance >= bounds.entry && car.distance <= bounds.exit;
  }

  function phaseAllowsDirection(zone, direction) {
    const phase = getPhase(zone);

    if (phase === "green-ns" || phase === "yellow-ns") {
      return direction === "north" || direction === "south";
    }

    return direction === "east" || direction === "west";
  }

  function isConflictingDirection(a, b) {
    const ns = direction => direction === "north" || direction === "south";
    return ns(a) !== ns(b);
  }

  function conflictingCarInIntersection(zone, direction) {
    return zoneState[zone].cars.some(other => {
      if (other.direction === direction) return false;
      if (!isConflictingDirection(direction, other.direction)) return false;
      return isInsideIntersection(other);
    });
  }

  function directionAllowed(zone, direction, distance) {
    const bounds = getIntersectionBounds(direction);

    /*
     * Once a vehicle has entered the intersection, the signal cannot
     * force it to stop. It must be allowed to clear the intersection.
     */
    if (distance >= bounds.entry) {
      return true;
    }

    /*
     * A vehicle may approach the stop line only when its movement phase
     * is active and the conflicting side of the intersection is clear.
     */
    return (
      phaseAllowsDirection(zone, direction) &&
      !conflictingCarInIntersection(zone, direction)
    );
  }

  function setLight(zone, direction, color) {
    ["red", "yellow", "green"].forEach(lightColor => {
      const element = document.getElementById(
        "light-" + zone + "-" + direction + "-" + lightColor
      );

      if (!element) return;

      element.classList.remove(
        "signal-red",
        "signal-yellow",
        "signal-green",
        "signal-off"
      );

      element.classList.add(
        lightColor === color ? "signal-" + color : "signal-off"
      );
    });
  }

  function updateSignals(zone) {
    const phase = getPhase(zone);

    if (phase === "green-ns") {
      setLight(zone, "north", "green");
      setLight(zone, "south", "green");
      setLight(zone, "east", "red");
      setLight(zone, "west", "red");
    } else if (phase === "yellow-ns") {
      setLight(zone, "north", "yellow");
      setLight(zone, "south", "yellow");
      setLight(zone, "east", "red");
      setLight(zone, "west", "red");
    } else if (phase === "green-ew") {
      setLight(zone, "north", "red");
      setLight(zone, "south", "red");
      setLight(zone, "east", "green");
      setLight(zone, "west", "green");
    } else {
      setLight(zone, "north", "red");
      setLight(zone, "south", "red");
      setLight(zone, "east", "yellow");
      setLight(zone, "west", "yellow");
    }
  }

  function randomCarColor() {
    const colors = [
      "#60a5fa",
      "#f97316",
      "#e5e7eb",
      "#a78bfa",
      "#f43f5e",
      "#34d399"
    ];

    return colors[Math.floor(Math.random() * colors.length)];
  }

  function carPosition(car) {
    const lane = laneGeometry[car.direction];

    if (lane.axis === "vertical") {
      return {
        x: lane.fixed,
        y: lane.start + lane.sign * car.distance
      };
    }

    return {
      x: lane.start + lane.sign * car.distance,
      y: lane.fixed
    };
  }

  function updateCarElement(car) {
    const position = carPosition(car);
    car.element.setAttribute("x", position.x);
    car.element.setAttribute("y", position.y);
  }

  function createCar(zone, direction) {
    const state = zoneState[zone];
    const group = document.getElementById("cars-" + zone);
    if (!group) return null;

    const car = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "rect"
    );

    car.setAttribute("class", "car");
    car.setAttribute(
      "width",
      direction === "north" || direction === "south" ? "9" : "18"
    );
    car.setAttribute(
      "height",
      direction === "north" || direction === "south" ? "18" : "9"
    );
    car.setAttribute("fill", randomCarColor());

    group.appendChild(car);

    const carState = {
      element: car,
      direction,
      distance: 0,
      speed: 42 + Math.random() * 18,
      id: Math.random().toString(36).slice(2)
    };

    state.cars.push(carState);
    updateCarElement(carState);

    return carState;
  }

  function laneHasEntrySpace(zone, direction) {
    return !zoneState[zone].cars.some(car => {
      if (car.direction !== direction) return false;
      return car.distance < 55;
    });
  }

  function spawnTraffic(zone) {
    const state = zoneState[zone];
    const desired = Math.min(MAX_CARS, getTrafficDemand(zone));

    if (state.cars.length >= desired) return;

    const now = Date.now();
    if (now - state.lastSpawn < state.spawnInterval) return;

    state.lastSpawn = now;

    const phase = getPhase(zone);
    const active =
      phase === "green-ns" || phase === "yellow-ns"
        ? ["north", "south"]
        : ["east", "west"];

    const inactive =
      phase === "green-ns" || phase === "yellow-ns"
        ? ["east", "west"]
        : ["north", "south"];

    const pool = [
      ...active,
      ...inactive,
      ...inactive
    ];

    for (let attempt = 0; attempt < 12; attempt++) {
      const direction =
        pool[Math.floor(Math.random() * pool.length)];

      if (laneHasEntrySpace(zone, direction)) {
        createCar(zone, direction);
        state.spawnInterval = 600 + Math.random() * 1100;
        return;
      }
    }
  }

  function getCarAhead(zone, car) {
    let closest = null;
    let closestGap = Infinity;

    for (const other of zoneState[zone].cars) {
      if (other === car) continue;
      if (other.direction !== car.direction) continue;

      const gap = other.distance - car.distance;

      if (gap > 0 && gap < closestGap) {
        closest = other;
        closestGap = gap;
      }
    }

    return closest;
  }

  function updateCars(zone, deltaSeconds) {
    const state = zoneState[zone];

    for (const car of state.cars) {
      const bounds = getIntersectionBounds(car.direction);
      const inside = isInsideIntersection(car);
      const ahead = getCarAhead(zone, car);

      let speed = car.speed;

      /*
       * Vehicles inside the intersection never obey the signal.
       * The only thing that can slow them is a vehicle ahead in the
       * exact same lane.
       */
      if (ahead) {
        const gap = ahead.distance - car.distance;

        if (inside) {
          /* Never stop in the middle of the intersection. */
          if (gap < MIN_GAP) {
            speed = Math.min(speed, 10);
          } else if (gap < COMFORT_GAP) {
            speed = Math.min(speed, 22);
          }
        } else {
          if (gap <= MIN_GAP) {
            speed = 0;
          } else if (gap < COMFORT_GAP) {
            speed = Math.min(speed, 12);
          }
        }
      }

      /*
       * Before the intersection, a red/conflicting movement stops at the
       * stop line. Once the car crosses the entry point, it continues.
       */
      if (!inside && car.distance < bounds.entry) {
        const allowed = directionAllowed(
          zone,
          car.direction,
          car.distance
        );

        if (!allowed) {
          const gapToStop = bounds.stop - car.distance;

          if (gapToStop <= 1) {
            car.distance = bounds.stop;
            speed = 0;
          } else if (gapToStop < 30) {
            speed = Math.min(
              speed,
              Math.max(4, gapToStop * 1.5)
            );
          } else {
            speed = Math.min(speed, 8);
          }
        }
      }

      car.distance += speed * deltaSeconds;

      /* Never cross a closed stop line. */
      if (
        car.distance < bounds.entry &&
        car.distance > bounds.stop &&
        !directionAllowed(zone, car.direction, car.distance)
      ) {
        car.distance = bounds.stop;
      }

      updateCarElement(car);
    }

    state.cars = state.cars.filter(car => {
      const bounds = getIntersectionBounds(car.direction);

      if (car.distance > bounds.exit + 80) {
        car.element.remove();
        return false;
      }

      return true;
    });
  }

anMove && car.distance > stopDistance) {
        car.distance = stopDistance;
      }

      updateCarElement(car);
    }

    /* Remove cars that have completely left the intersection. */
    state.cars = state.cars.filter(car => {
      const lane = laneGeometry[car.direction];
      const exitDistance = Math.abs(lane.end - lane.start);

      if (car.distance > exitDistance) {
        car.element.remove();
        return false;
      }

      return true;
    });
  }

  function updateMessages(zone) {
    const demand = getTrafficDemand(zone);
    const phase = getPhase(zone);

    let direction = "EAST / WEST";

    if (phase === "green-ns" || phase === "yellow-ns") {
      direction = "NORTH / SOUTH";
    }

    let trafficLevel = "NORMAL TRAFFIC";

    if (demand >= 8) {
      trafficLevel = "HEAVY TRAFFIC";
    } else if (demand >= 5) {
      trafficLevel = "MODERATE TRAFFIC";
    }

    const message = document.getElementById("message-" + zone);
    if (message) {
      message.textContent =
        "VMS: " + trafficLevel + " — " + direction;
    }

    const status = document.getElementById("status-" + zone);
    if (status) {
      status.textContent =
        direction +
        " ACTIVE — " +
        zoneState[zone].cars.length +
        " VEHICLES ON ROAD";
    }

    const operations = document.getElementById("ops-" + zone);
    if (operations) {
      operations.textContent =
        trafficZones[zone].name +
        ": " +
        zoneState[zone].cars.length +
        " VEHICLES / " +
        direction;
    }
  }

  let lastFrame = performance.now();

  function animate(now) {
    const deltaSeconds = Math.min(
      0.05,
      (now - lastFrame) / 1000
    );

    lastFrame = now;

    Object.keys(trafficZones).forEach(zone => {
      updateDemand(zone);
      updateSignals(zone);
      spawnTraffic(zone);
      updateCars(zone, deltaSeconds);
      updateMessages(zone);
    });

    const update = document.getElementById("last-update");

    if (update) {
      update.textContent =
        "Last update: " +
        new Date().toLocaleTimeString();
    }

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
