{% extends "diagram_base.html" %}

<style>

    font-family: Arial, Helvetica, sans-serif;

</style>

  <!-- ========================================================= -->
  <!-- JAVASCRIPT -->
  <!-- ========================================================= -->

 <script>
  const trafficZones = {
    i75: {
      name: "I-75",
      loopTag: "LOOP-101"
    },
    us35: {
      name: "US-35",
      loopTag: "LOOP-201"
    },
    sr48: {
      name: "SR-48",
      loopTag: "LOOP-301"
    },
    downtown: {
      name: "DOWNTOWN",
      loopTag: "LOOP-401"
    }
  };

  const zoneState = {};

  const ROAD_LENGTH = 390;
  const STOP_DISTANCE = 125;
  const INTERSECTION_START = 145;
  const INTERSECTION_END = 265;
  const CAR_GAP = 30;
  const MAX_CARS_PER_ZONE = 18;

  Object.keys(trafficZones).forEach(zone => {
    zoneState[zone] = {
      cycleStart:
        Date.now() -
        Math.floor(Math.random() * 12000),

      phaseOffset:
        Math.floor(Math.random() * 15000),

      cycleLength: 30000,

      demand:
        Math.floor(Math.random() * 6) + 3,

      lastDemandChange: Date.now(),

      lastSpawn: 0,

      spawnInterval:
        900 +
        Math.random() * 900,

      cars: []
    };
  });


  /* ========================================================= */
  /* SENSOR VALUES                                             */
  /* ========================================================= */

  function getNumericSensorValue(tag) {
    const element =
      document.getElementById("val-" + tag);

    if (!element) {
      return null;
    }

    const raw =
      element.textContent.trim();

    if (!raw || raw === "—") {
      return null;
    }

    const value =
      parseFloat(raw);

    return Number.isFinite(value)
      ? value
      : null;
  }


  function getTrafficDemand(zone) {
    const liveValue =
      getNumericSensorValue(
        trafficZones[zone].loopTag
      );

    if (liveValue !== null) {
      return Math.max(
        1,
        Math.min(
          MAX_CARS_PER_ZONE,
          Math.round(liveValue)
        )
      );
    }

    return zoneState[zone].demand;
  }


  /* ========================================================= */
  /* TRAFFIC DEMAND                                            */
  /* ========================================================= */

  function updateDemand(zone) {
    const state =
      zoneState[zone];

    const now =
      Date.now();

    if (
      now - state.lastDemandChange <
      5000
    ) {
      return;
    }

    state.lastDemandChange =
      now;

    const change =
      Math.floor(
        Math.random() * 5
      ) - 2;

    state.demand =
      Math.max(
        1,
        Math.min(
          14,
          state.demand + change
        )
      );
  }


  /* ========================================================= */
  /* TRAFFIC SIGNAL STATE                                      */
  /* ========================================================= */

  function getPhase(zone) {
    const state =
      zoneState[zone];

    const elapsed =
      (
        Date.now() -
        state.cycleStart +
        state.phaseOffset
      ) %
      state.cycleLength;

    if (elapsed < 12000) {
      return "green-ns";
    }

    if (elapsed < 15000) {
      return "yellow-ns";
    }

    if (elapsed < 27000) {
      return "green-ew";
    }

    return "yellow-ew";
  }


  function directionAllowed(
    zone,
    direction,
    carDistance
  ) {
    const phase =
      getPhase(zone);

    /*
     * Cars that are already inside the
     * intersection are always allowed
     * to clear it.
     */
    if (
      carDistance >=
      INTERSECTION_START
    ) {
      return true;
    }

    if (
      phase === "green-ns" ||
      phase === "yellow-ns"
    ) {
      return (
        direction === "north" ||
        direction === "south"
      );
    }

    return (
      direction === "east" ||
      direction === "west"
    );
  }


  /* ========================================================= */
  /* LIGHTS                                                    */
  /* ========================================================= */

  function setLight(
    zone,
    direction,
    activeColor
  ) {
    [
      "red",
      "yellow",
      "green"
    ].forEach(color => {

      const element =
        document.getElementById(
          "light-" +
          zone +
          "-" +
          direction +
          "-" +
          color
        );

      if (!element) {
        return;
      }

      element.classList.remove(
        "signal-red",
        "signal-yellow",
        "signal-green",
        "signal-off"
      );

      element.classList.add(
        color === activeColor
          ? "signal-" + color
          : "signal-off"
      );
    });
  }


  function updateSignals(zone) {
    const phase =
      getPhase(zone);

    if (phase === "green-ns") {

      setLight(
        zone,
        "north",
        "green"
      );

      setLight(
        zone,
        "south",
        "green"
      );

      setLight(
        zone,
        "east",
        "red"
      );

      setLight(
        zone,
        "west",
        "red"
      );

    } else if (
      phase === "yellow-ns"
    ) {

      setLight(
        zone,
        "north",
        "yellow"
      );

      setLight(
        zone,
        "south",
        "yellow"
      );

      setLight(
        zone,
        "east",
        "red"
      );

      setLight(
        zone,
        "west",
        "red"
      );

    } else if (
      phase === "green-ew"
    ) {

      setLight(
        zone,
        "north",
        "red"
      );

      setLight(
        zone,
        "south",
        "red"
      );

      setLight(
        zone,
        "east",
        "green"
      );

      setLight(
        zone,
        "west",
        "green"
      );

    } else {

      setLight(
        zone,
        "north",
        "red"
      );

      setLight(
        zone,
        "south",
        "red"
      );

      setLight(
        zone,
        "east",
        "yellow"
      );

      setLight(
        zone,
        "west",
        "yellow"
      );
    }
  }


  /* ========================================================= */
  /* CAR COLORS                                                */
  /* ========================================================= */

  function randomCarColor() {
    const colors = [
      "#60a5fa",
      "#f97316",
      "#e5e7eb",
      "#a78bfa",
      "#f43f5e",
      "#34d399"
    ];

    return colors[
      Math.floor(
        Math.random() *
        colors.length
      )
    ];
  }


  /* ========================================================= */
  /* CAR POSITIONING                                           */
  /* ========================================================= */

  function calculatePosition(
    car
  ) {
    const d =
      car.distance;

    const lane =
      car.lane === 0
        ? -13
        : 13;

    switch (car.direction) {

      case "north":
        return {
          x: 177 + lane,
          y: 35 + d
        };

      case "south":
        return {
          x: 177 + lane,
          y: 302 - d
        };

      case "east":
        return {
          x: 370 - d,
          y: 164 + lane
        };

      case "west":
        return {
          x: d - 20,
          y: 164 + lane
        };

      default:
        return {
          x: 0,
          y: 0
        };
    }
  }


  /* ========================================================= */
  /* CREATE CAR                                                */
  /* ========================================================= */

  function createCar(
    zone,
    direction
  ) {
    const state =
      zoneState[zone];

    const group =
      document.getElementById(
        "cars-" + zone
      );

    if (!group) {
      return;
    }

    const car =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "rect"
      );

    car.setAttribute(
      "class",
      "car"
    );

    if (
      direction === "north" ||
      direction === "south"
    ) {

      car.setAttribute(
        "width",
        "9"
      );

      car.setAttribute(
        "height",
        "18"
      );

    } else {

      car.setAttribute(
        "width",
        "18"
      );

      car.setAttribute(
        "height",
        "9"
      );
    }

    car.setAttribute(
      "fill",
      randomCarColor()
    );

    group.appendChild(car);

    const carState = {
      element: car,

      direction,

      lane:
        Math.random() < 0.5
          ? 0
          : 1,

      distance: 0,

      speed:
        42 +
        Math.random() * 20
    };

    state.cars.push(
      carState
    );

    updateCarElement(
      carState
    );
  }


  function updateCarElement(
    car
  ) {
    const position =
      calculatePosition(
        car
      );

    car.element.setAttribute(
      "x",
      position.x
    );

    car.element.setAttribute(
      "y",
      position.y
    );
  }


  /* ========================================================= */
  /* SPAWN TRAFFIC                                             */
  /* ========================================================= */

  function spawnTraffic(zone) {
    const state =
      zoneState[zone];

    if (
      state.cars.length >=
      MAX_CARS_PER_ZONE
    ) {
      return;
    }

    const demand =
      getTrafficDemand(zone);

    if (
      state.cars.length >=
      demand
    ) {
      return;
    }

    const now =
      Date.now();

    if (
      now - state.lastSpawn <
      state.spawnInterval
    ) {
      return;
    }

    state.lastSpawn =
      now;

    const directions = [
      "north",
      "south",
      "east",
      "west"
    ];

    /*
     * Try several times to find
     * an open entry lane.
     */
    for (
      let attempt = 0;
      attempt < 8;
      attempt++
    ) {

      const direction =
        directions[
          Math.floor(
            Math.random() *
            directions.length
          )
        ];

      const lane =
        Math.random() < 0.5
          ? 0
          : 1;

      const blocked =
        state.cars.some(car =>
          car.direction ===
            direction &&
          car.lane ===
            lane &&
          car.distance < 45
        );

      if (!blocked) {

        createCar(
          zone,
          direction
        );

        /*
         * Assign a fresh random spawn
         * interval so traffic doesn't
         * look perfectly periodic.
         */
        state.spawnInterval =
          700 +
          Math.random() * 1400;

        return;
      }
    }
  }


  /* ========================================================= */
  /* CAR FOLLOWING                                             */
  /* ========================================================= */

  function getCarAhead(
    zone,
    car
  ) {
    const cars =
      zoneState[zone].cars;

    let closest = null;
    let closestDistance =
      Infinity;

    cars.forEach(other => {

      if (other === car) {
        return;
      }

      if (
        other.direction !==
        car.direction
      ) {
        return;
      }

      if (
        other.lane !==
        car.lane
      ) {
        return;
      }

      if (
        other.distance <=
        car.distance
      ) {
        return;
      }

      const gap =
        other.distance -
        car.distance;

      if (
        gap <
        closestDistance
      ) {

        closest =
          other;

        closestDistance =
          gap;
      }
    });

    return closest;
  }


  /* ========================================================= */
  /* CAR MOVEMENT                                              */
  /* ========================================================= */

  function updateCars(
    zone,
    deltaSeconds
  ) {
    const state =
      zoneState[zone];

    state.cars.forEach(car => {

      let speed =
        car.speed;

      const phase =
        getPhase(zone);

      /*
       * Slow down slightly during yellow.
       */
      if (
        phase === "yellow-ns" ||
        phase === "yellow-ew"
      ) {
        speed *= 0.65;
      }

      const ahead =
        getCarAhead(
          zone,
          car
        );

      /*
       * Following distance.
       */
      if (ahead) {

        const gap =
          ahead.distance -
          car.distance;

        if (gap < CAR_GAP) {

          speed = 0;

        } else if (
          gap < CAR_GAP + 18
        ) {

          speed *= 0.35;
        }
      }

      /*
       * Determine whether the signal
       * requires this car to stop.
       */
      const allowed =
        directionAllowed(
          zone,
          car.direction,
          car.distance
        );

      /*
       * Only stop at the stop line if
       * the car has not entered the
       * intersection yet.
       */
      if (
        !allowed &&
        car.distance <
          STOP_DISTANCE
      ) {

        const distanceToStop =
          STOP_DISTANCE -
          car.distance;

        /*
         * Slow down approaching
         * the red light.
         */
        if (
          distanceToStop <
          30
        ) {

          speed =
            Math.min(
              speed,
              Math.max(
                0,
                distanceToStop *
                  1.5
              )
            );

        } else {

          speed =
            Math.min(
              speed,
              12
            );
        }
      }

      /*
       * Move.
       */
      car.distance +=
        speed *
        deltaSeconds;

      /*
       * Never overshoot the stop line
       * on red.
       */
      if (
        !allowed &&
        car.distance >
          STOP_DISTANCE &&
        car.distance <
          INTERSECTION_START
      ) {

        car.distance =
          STOP_DISTANCE;
      }

      updateCarElement(
        car
      );
    });

    /*
     * Remove cars after they leave
     * the intersection.
     */
    state.cars =
      state.cars.filter(car => {

        if (
          car.distance >
          ROAD_LENGTH
        ) {

          car.element.remove();

          return false;
        }

        return true;
      });
  }


  /* ========================================================= */
  /* STATUS / VMS                                             */
  /* ========================================================= */

  function updateMessages(
    zone
  ) {
    const demand =
      getTrafficDemand(zone);

    const phase =
      getPhase(zone);

    let direction =
      "EAST / WEST";

    if (
      phase === "green-ns" ||
      phase === "yellow-ns"
    ) {
      direction =
        "NORTH / SOUTH";
    }

    let level =
      "NORMAL TRAFFIC";

    if (
      demand >= 9
    ) {

      level =
        "HEAVY TRAFFIC";

    } else if (
      demand >= 5
    ) {

      level =
        "MODERATE TRAFFIC";
    }

    const message =
      document.getElementById(
        "message-" + zone
      );

    if (message) {
      message.textContent =
        "VMS: " +
        level +
        " — " +
        direction;
    }

    const status =
      document.getElementById(
        "status-" + zone
      );

    if (status) {
      status.textContent =
        direction +
        " ACTIVE — " +
        zoneState[zone].cars.length +
        " VEHICLES ON ROAD";
    }

    const operations =
      document.getElementById(
        "ops-" + zone
      );

    if (operations) {
      operations.textContent =
        trafficZones[zone].name +
        ": " +
        zoneState[zone].cars.length +
        " VEHICLES / " +
        direction;
    }
  }


  /* ========================================================= */
  /* ANIMATION LOOP                                            */
  /* ========================================================= */

  let lastFrame =
    performance.now();

  function animate(now) {

    const deltaSeconds =
      Math.min(
        0.05,
        (now - lastFrame) /
          1000
      );

    lastFrame = now;

    Object.keys(
      trafficZones
    ).forEach(zone => {

      updateDemand(zone);

      updateSignals(zone);

      spawnTraffic(zone);

      updateCars(
        zone,
        deltaSeconds
      );

      updateMessages(zone);
    });

    const update =
      document.getElementById(
        "last-update"
      );

    if (update) {

      update.textContent =
        "Last update: " +
        new Date().toLocaleTimeString();
    }

    requestAnimationFrame(
      animate
    );
  }

  requestAnimationFrame(
    animate
  );
</script>
