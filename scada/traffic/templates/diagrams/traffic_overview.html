</style>

  <!-- ========================================================= -->
  <!-- JAVASCRIPT -->
  <!-- ========================================================= -->
<script>
  const trafficZones = {
    i75: { name: "I-75", loopTag: "LOOP-101" },
    us35: { name: "US-35", loopTag: "LOOP-201" },
    sr48: { name: "SR-48", loopTag: "LOOP-301" },
    downtown: { name: "DOWNTOWN", loopTag: "LOOP-401" }
  };

  /*
   * RIGHT-HAND TRAFFIC LANE GEOMETRY
   *
   * Each approach has two one-way lanes:
   *
   *   Northbound: east/right side of the vertical road
   *   Southbound: west/left side of the vertical road
   *   Eastbound:  south/bottom side of the horizontal road
   *   Westbound:  north/top side of the horizontal road
   *
   * Vehicles NEVER switch lanes and never share a lane with opposing traffic.
   */
  const laneGeometry = {
    north: {
      axis: "vertical",
      fixed: 205,
      start: 310,
      stopY: 242,
      entryY: 225,
      exitY: 120,
      end: -25,
      sign: -1
    },

    south: {
      axis: "vertical",
      fixed: 165,
      start: 35,
      stopY: 103,
      entryY: 120,
      exitY: 225,
      end: 335,
      sign: 1
    },

    east: {
      axis: "horizontal",
      fixed: 194,
      start: 0,
      stopX: 120,
      entryX: 132,
      exitX: 238,
      end: 395,
      sign: 1
    },

    west: {
      axis: "horizontal",
      fixed: 151,
      start: 370,
      stopX: 250,
      entryX: 238,
      exitX: 132,
      end: -25,
      sign: -1
    }
  };

  const MAX_CARS = 16;
  const MIN_GAP = 24;
  const COMFORT_GAP = 34;
  const ENTRY_GAP = 48;

  const zoneState = {};

  Object.keys(trafficZones).forEach(zone => {
    zoneState[zone] = {
      cycleStart: Date.now() - Math.floor(Math.random() * 15000),
      phaseOffset: Math.floor(Math.random() * 15000),
      cycleLength: 30000,
      demand: Math.floor(Math.random() * 6) + 3,
      lastDemandChange: Date.now(),
      lastSpawn: 0,
      spawnInterval: 650 + Math.random() * 1000,
      cars: []
    };
  });

  function getNumericSensorValue(tag) {
    const element = document.getElementById("val-" + tag);
    if (!element) return null;

    const raw = element.textContent.trim();
    if (!raw || raw === "—") return null;

    const value = parseFloat(raw);
    return Number.isFinite(value) ? value : null;
  }

  function getTrafficDemand(zone) {
    const liveValue = getNumericSensorValue(trafficZones[zone].loopTag);

    if (liveValue !== null) {
      return Math.max(2, Math.min(MAX_CARS, Math.round(liveValue)));
    }

    return zoneState[zone].demand;
  }

  function updateDemand(zone) {
    const state = zoneState[zone];
    const now = Date.now();

    if (now - state.lastDemandChange < 5000) return;

    state.lastDemandChange = now;

    const change = Math.floor(Math.random() * 5) - 2;
    state.demand = Math.max(2, Math.min(14, state.demand + change));
  }

  function getPhase(zone) {
    const state = zoneState[zone];

    const elapsed = (
      Date.now() -
      state.cycleStart +
      state.phaseOffset
    ) % state.cycleLength;

    if (elapsed < 12000) return "green-ns";
    if (elapsed < 15000) return "yellow-ns";
    if (elapsed < 27000) return "green-ew";
    return "yellow-ew";
  }

  function phaseAllowsDirection(zone, direction) {
    const phase = getPhase(zone);

    if (phase === "green-ns" || phase === "yellow-ns") {
      return direction === "north" || direction === "south";
    }

    return direction === "east" || direction === "west";
  }

  function getLane(direction) {
    return laneGeometry[direction];
  }

  function getDistanceToEntry(car) {
    const lane = getLane(car.direction);
    return lane.axis === "vertical"
      ? Math.abs(lane.entryY - car.y)
      : Math.abs(lane.entryX - car.x);
  }

  function isInsideIntersection(car) {
    const lane = getLane(car.direction);

    if (lane.axis === "vertical") {
      return car.y >= Math.min(lane.entryY, lane.exitY) &&
             car.y <= Math.max(lane.entryY, lane.exitY);
    }

    return car.x >= Math.min(lane.entryX, lane.exitX) &&
           car.x <= Math.max(lane.entryX, lane.exitX);
  }

  function conflictingCarInIntersection(zone, direction) {
    const isNS = direction === "north" || direction === "south";

    return zoneState[zone].cars.some(other => {
      if (other.direction === direction) return false;

      const otherIsNS =
        other.direction === "north" ||
        other.direction === "south";

      return isNS !== otherIsNS && isInsideIntersection(other);
    });
  }

  function directionAllowed(zone, direction, car) {
    /*
     * Once the front of the car has entered the intersection,
     * it is NEVER stopped by the signal. It must clear the box.
     */
    if (isInsideIntersection(car)) return true;

    if (!phaseAllowsDirection(zone, direction)) return false;

    /* Do not release cross traffic while the intersection is occupied. */
    if (conflictingCarInIntersection(zone, direction)) return false;

    return true;
  }

  function setLight(zone, direction, color) {
    ["red", "yellow", "green"].forEach(lightColor => {
      const element = document.getElementById(
        "light-" + zone + "-" + direction + "-" + lightColor
      );

      if (!element) return;

      element.classList.remove(
        "signal-red",
        "signal-yellow",
        "signal-green",
        "signal-off"
      );

      element.classList.add(
        lightColor === color ? "signal-" + color : "signal-off"
      );
    });
  }

  function updateSignals(zone) {
    const phase = getPhase(zone);

    if (phase === "green-ns") {
      setLight(zone, "north", "green");
      setLight(zone, "south", "green");
      setLight(zone, "east", "red");
      setLight(zone, "west", "red");
    } else if (phase === "yellow-ns") {
      setLight(zone, "north", "yellow");
      setLight(zone, "south", "yellow");
      setLight(zone, "east", "red");
      setLight(zone, "west", "red");
    } else if (phase === "green-ew") {
      setLight(zone, "north", "red");
      setLight(zone, "south", "red");
      setLight(zone, "east", "green");
      setLight(zone, "west", "green");
    } else {
      setLight(zone, "north", "red");
      setLight(zone, "south", "red");
      setLight(zone, "east", "yellow");
      setLight(zone, "west", "yellow");
    }
  }

  function randomCarColor() {
    const colors = [
      "#60a5fa",
      "#f97316",
      "#e5e7eb",
      "#a78bfa",
      "#f43f5e",
      "#34d399"
    ];

    return colors[Math.floor(Math.random() * colors.length)];
  }

  function carPosition(car) {
    const lane = getLane(car.direction);

    if (lane.axis === "vertical") {
      return {
        x: lane.fixed,
        y: car.y
      };
    }

    return {
      x: car.x,
      y: lane.fixed
    };
  }

  function updateCarElement(car) {
    const position = carPosition(car);
    car.element.setAttribute("x", position.x);
    car.element.setAttribute("y", position.y);
  }

  function createCar(zone, direction) {
    const state = zoneState[zone];
    const group = document.getElementById("cars-" + zone);
    if (!group) return null;

    const lane = getLane(direction);

    const car = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "rect"
    );

    car.setAttribute("class", "car");

    if (lane.axis === "vertical") {
      car.setAttribute("width", "10");
      car.setAttribute("height", "18");
    } else {
      car.setAttribute("width", "18");
      car.setAttribute("height", "10");
    }

    car.setAttribute("fill", randomCarColor());
    group.appendChild(car);

    const carState = {
      element: car,
      direction,
      speed: 42 + Math.random() * 18,
      x: lane.axis === "horizontal" ? lane.start : lane.fixed,
      y: lane.axis === "vertical" ? lane.start : lane.fixed,
      id: Math.random().toString(36).slice(2)
    };

    state.cars.push(carState);
    updateCarElement(carState);

    return carState;
  }

  function entryDistanceFromStart(car) {
    const lane = getLane(car.direction);

    if (lane.axis === "vertical") {
      return Math.abs(car.y - lane.start);
    }

    return Math.abs(car.x - lane.start);
  }

  function laneHasEntrySpace(zone, direction) {
    return !zoneState[zone].cars.some(car => {
      if (car.direction !== direction) return false;
      return entryDistanceFromStart(car) < ENTRY_GAP;
    });
  }

  function spawnTraffic(zone) {
    const state = zoneState[zone];
    const desired = Math.min(MAX_CARS, getTrafficDemand(zone));

    if (state.cars.length >= desired) return;

    const now = Date.now();
    if (now - state.lastSpawn < state.spawnInterval) return;

    state.lastSpawn = now;

    const phase = getPhase(zone);

    const active =
      phase === "green-ns" || phase === "yellow-ns"
        ? ["north", "south"]
        : ["east", "west"];

    const inactive =
      phase === "green-ns" || phase === "yellow-ns"
        ? ["east", "west"]
        : ["north", "south"];

    /* Mostly spawn active traffic, but keep cross traffic alive. */
    const pool = [
      ...active,
      ...active,
      ...inactive
    ];

    for (let attempt = 0; attempt < 12; attempt++) {
      const direction =
        pool[Math.floor(Math.random() * pool.length)];

      if (laneHasEntrySpace(zone, direction)) {
        createCar(zone, direction);
        state.spawnInterval = 600 + Math.random() * 1100;
        return;
      }
    }
  }

  function getCarAhead(zone, car) {
    let closest = null;
    let closestGap = Infinity;

    const lane = getLane(car.direction);

    for (const other of zoneState[zone].cars) {
      if (other === car) continue;
      if (other.direction !== car.direction) continue;

      let gap;

      if (lane.axis === "vertical") {
        if (lane.sign === -1) {
          gap = other.y - car.y;
        } else {
          gap = car.y - other.y;
        }
      } else {
        if (lane.sign === 1) {
          gap = other.x - car.x;
        } else {
          gap = car.x - other.x;
        }
      }

      if (gap > 0 && gap < closestGap) {
        closest = other;
        closestGap = gap;
      }
    }

    return closest;
  }

  function advanceCar(car, amount) {
    const lane = getLane(car.direction);

    if (lane.axis === "vertical") {
      car.y += lane.sign * amount;
    } else {
      car.x += lane.sign * amount;
    }
  }

  function distanceToStopLine(car) {
    const lane = getLane(car.direction);

    if (lane.axis === "vertical") {
      return Math.abs(car.y - lane.stopY);
    }

    return Math.abs(car.x - lane.stopX);
  }

  function distanceToIntersectionEntry(car) {
    const lane = getLane(car.direction);

    if (lane.axis === "vertical") {
      return Math.abs(car.y - lane.entryY);
    }

    return Math.abs(car.x - lane.entryX);
  }

  function updateCars(zone, deltaSeconds) {
    const state = zoneState[zone];

    for (const car of state.cars) {
      const lane = getLane(car.direction);
      const inside = isInsideIntersection(car);
      const ahead = getCarAhead(zone, car);

      let speed = car.speed;

      /* Same-lane following only. */
      if (ahead) {
        let gap;

        if (lane.axis === "vertical") {
          gap = lane.sign === -1
            ? ahead.y - car.y
            : car.y - ahead.y;
        } else {
          gap = lane.sign === 1
            ? ahead.x - car.x
            : car.x - ahead.x;
        }

        if (gap <= MIN_GAP) {
          speed = 0;
        } else if (gap < COMFORT_GAP) {
          speed = Math.min(speed, 14);
        }
      }

      /*
       * A vehicle already inside the intersection never stops for
       * the signal. It only follows another car in its own lane.
       */
      if (!inside) {
        const allowed =
          directionAllowed(
            zone,
            car.direction,
            car
          );

        if (!allowed) {
          const toStop =
            distanceToStopLine(car);

          /* Slow down as we approach the stop line. */
          if (toStop <= 2) {
            speed = 0;
          } else if (toStop < 32) {
            speed = Math.min(
              speed,
              Math.max(4, toStop * 1.5)
            );
          } else {
            speed = Math.min(speed, 8);
          }
        }
      }

      /* Do not let a car jump through another car or signal. */
      const movement = speed * deltaSeconds;

      if (movement > 0) {
        const before = {
          x: car.x,
          y: car.y
        };

        advanceCar(car, movement);

        /* Keep stopped vehicles exactly at the stop line. */
        if (!inside && !directionAllowed(zone, car.direction, car)) {
          const laneNow = getLane(car.direction);

          if (laneNow.axis === "vertical") {
            if (laneNow.sign === -1 && car.y < laneNow.stopY) {
              car.y = laneNow.stopY;
            }
            if (laneNow.sign === 1 && car.y > laneNow.stopY) {
              car.y = laneNow.stopY;
            }
          } else {
            if (laneNow.sign === 1 && car.x > laneNow.stopX) {
              car.x = laneNow.stopX;
            }
            if (laneNow.sign === -1 && car.x < laneNow.stopX) {
              car.x = laneNow.stopX;
            }
          }
        }

        /* Safety fallback: never allow a single-frame huge jump. */
        if (lane.axis === "vertical") {
          if (Math.abs(car.y - before.y) > 6) {
            car.y = before.y;
          }
        } else if (Math.abs(car.x - before.x) > 6) {
          car.x = before.x;
        }
      }

      updateCarElement(car);
    }

    state.cars = state.cars.filter(car => {
      const lane = getLane(car.direction);

      const outside =
        lane.axis === "vertical"
          ? (lane.sign === -1
              ? car.y < lane.end
              : car.y > lane.end)
          : (lane.sign === 1
              ? car.x > lane.end
              : car.x < lane.end);

      if (outside) {
        car.element.remove();
        return false;
      }

      return true;
    });
  }

  function updateMessages(zone) {
    const demand = getTrafficDemand(zone);
    const phase = getPhase(zone);

    const direction =
      phase === "green-ns" || phase === "yellow-ns"
        ? "NORTH / SOUTH"
        : "EAST / WEST";

    let trafficLevel = "NORMAL TRAFFIC";

    if (demand >= 8) {
      trafficLevel = "HEAVY TRAFFIC";
    } else if (demand >= 5) {
      trafficLevel = "MODERATE TRAFFIC";
    }

    const message = document.getElementById("message-" + zone);
    if (message) {
      message.textContent =
        "VMS: " + trafficLevel + " — " + direction;
    }

    const status = document.getElementById("status-" + zone);
    if (status) {
      status.textContent =
        direction +
        " ACTIVE — " +
        zoneState[zone].cars.length +
        " VEHICLES ON ROAD";
    }

    const operations = document.getElementById("ops-" + zone);
    if (operations) {
      operations.textContent =
        trafficZones[zone].name +
        ": " +
        zoneState[zone].cars.length +
        " VEHICLES / " +
        direction;
    }
  }

  let lastFrame = performance.now();

  function animate(now) {
    const deltaSeconds = Math.min(
      0.05,
      (now - lastFrame) / 1000
    );

    lastFrame = now;

    Object.keys(trafficZones).forEach(zone => {
      updateDemand(zone);
      updateSignals(zone);
      spawnTraffic(zone);
      updateCars(zone, deltaSeconds);
      updateMessages(zone);
    });

    const update = document.getElementById("last-update");
    if (update) {
      update.textContent =
        "Last update: " +
        new Date().toLocaleTimeString();
    }

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
</script>
</svg>
