{% extends "diagram_base.html" %}
{% block diagram %}

<style>

    font-family: Arial, Helvetica, sans-serif;
  }

  .traffic-title {
    font-size: 28px;
    font-weight: bold;
    fill: #ffffff;
    letter-spacing: 1px;
  }

  .traffic-subtitle {
    font-size: 13px;
    fill: #cbd5e1;
  }

    font-size: 18px;
    font-weight: bold;
    fill: #ffffff;

    font-weight: bold;
    fill: #d1d5db;
  }

    stroke: #111827;
    stroke-width: 2;
  }

  .road-line {

    stroke-width: 3;
    stroke-dasharray: 18 14;
    opacity: 0.8;
  }

  .lane-line {
    stroke: #e5e7eb;
    stroke-width: 2;
    opacity: 0.65;
  }

  .intersection {
    fill: #20242a;
    stroke: #111827;
    stroke-width: 2;
  }

  .grass {
    fill: #687442;
  }

  .signal-housing {
    fill: #171717;
    stroke: #9ca3af;
    stroke-width: 1;
  }

  .signal-light {
    stroke: #111827;
    stroke-width: 2;
  }

  .signal-red {
    fill: #ef4444;
  }

  .signal-yellow {
    fill: #facc15;
  }

  .signal-green {
    fill: #22c55e;
  }

  .signal-off {
    fill: #374151;
  }

  }

  .sensor-panel {

    stroke-width: 1;

</style>

  <!-- ========================================================= -->
  <!-- JAVASCRIPT -->
  <!-- ========================================================= -->
<script>
  const trafficZones = {
    i75: {
      name: "I-75",
      loopTag: "LOOP-101"
    },

    us35: {
      name: "US-35",
      loopTag: "LOOP-201"
    },

    sr48: {
      name: "SR-48",
      loopTag: "LOOP-301"
    },

    downtown: {
      name: "DOWNTOWN",
      loopTag: "LOOP-401"
    }
  };

  const zoneState = {};

  /* --------------------------------------------------------- */
  /* Zone state                                                */
  /* --------------------------------------------------------- */

  Object.keys(trafficZones).forEach(zone => {

    zoneState[zone] = {
      cycleStart:
        Date.now() -
        Math.floor(Math.random() * 15000),

      phaseOffset:
        Math.floor(Math.random() * 15000),

      cycleLength: 30000,

      queueTarget:
        Math.floor(Math.random() * 6) + 2,

      lastQueueUpdate: Date.now(),

      lastSpawn: 0,

      spawnInterval:
        900 +
        Math.floor(Math.random() * 1200),

      cars: []
    };

  });


  /* --------------------------------------------------------- */
  /* Sensor values                                             */
  /* --------------------------------------------------------- */

  function getNumericSensorValue(tag) {

    const element =
      document.getElementById(
        "val-" + tag
      );

    if (!element) {
      return null;
    }

    const raw =
      element.textContent.trim();

    if (!raw || raw === "—") {
      return null;
    }

    const value =
      parseFloat(raw);

    if (!Number.isFinite(value)) {
      return null;
    }

    return value;
  }


  /* --------------------------------------------------------- */
  /* Traffic demand                                            */
  /* --------------------------------------------------------- */

  function getTrafficDemand(zone) {

    const config =
      trafficZones[zone];

    const liveLoop =
      getNumericSensorValue(
        config.loopTag
      );

    /*
     * If the actual LOOP sensor is producing a
     * numeric vehicle count, use it.
     */
    if (liveLoop !== null) {

      return Math.max(
        0,
        Math.min(
          12,
          Math.round(liveLoop)
        )
      );

    }

    /*
     * Otherwise generate a realistic changing
     * traffic demand.
     */
    return zoneState[zone].queueTarget;

  }


  /* --------------------------------------------------------- */
  /* Changing traffic demand                                   */
  /* --------------------------------------------------------- */

  function updateTrafficDemand(zone) {

    const state =
      zoneState[zone];

    const now =
      Date.now();

    if (
      now -
      state.lastQueueUpdate <
      5000
    ) {
      return;
    }

    state.lastQueueUpdate = now;

    /*
     * Occasionally traffic gets heavier or lighter.
     */
    const change =
      Math.floor(
        Math.random() * 5
      ) - 2;

    state.queueTarget =
      Math.max(
        0,
        Math.min(
          12,
          state.queueTarget + change
        )
      );

  }


  /* --------------------------------------------------------- */
  /* Signal cycle                                              */
  /* --------------------------------------------------------- */

  function getPhase(zone) {

    const state =
      zoneState[zone];

    const elapsed =
      (
        Date.now() -
        state.cycleStart +
        state.phaseOffset
      ) %
      state.cycleLength;

    /*
     * 0-12 sec:
     * North/South GREEN
     *
     * 12-15 sec:
     * North/South YELLOW
     *
     * 15-27 sec:
     * East/West GREEN
     *
     * 27-30 sec:
     * East/West YELLOW
     */

    if (elapsed < 12000) {
      return "green-ns";
    }

    if (elapsed < 15000) {
      return "yellow-ns";
    }

    if (elapsed < 27000) {
      return "green-ew";
    }

    return "yellow-ew";
  }


  /* --------------------------------------------------------- */
  /* Which directions may move?                                */
  /* --------------------------------------------------------- */

  function directionPermission(
    zone,
    direction
  ) {

    const phase =
      getPhase(zone);

    if (
      phase === "green-ns"
    ) {

      return (
        direction === "north" ||
        direction === "south"
      );

    }

    if (
      phase === "yellow-ns"
    ) {

      return (
        direction === "north" ||
        direction === "south"
      );

    }

    if (
      phase === "green-ew"
    ) {

      return (
        direction === "east" ||
        direction === "west"
      );

    }

    if (
      phase === "yellow-ew"
    ) {

      return (
        direction === "east" ||
        direction === "west"
      );

    }

    return false;

  }


  /* --------------------------------------------------------- */
  /* Signal lights                                              */
  /* --------------------------------------------------------- */

  function setLight(
    zone,
    direction,
    color
  ) {

    const colors = [
      "red",
      "yellow",
      "green"
    ];

    colors.forEach(lightColor => {

      const element =
        document.getElementById(
          "light-" +
          zone +
          "-" +
          direction +
          "-" +
          lightColor
        );

      if (!element) {
        return;
      }

      element.classList.remove(
        "signal-red",
        "signal-yellow",
        "signal-green",
        "signal-off"
      );

      if (
        lightColor === color
      ) {

        element.classList.add(
          "signal-" + color
        );

      } else {

        element.classList.add(
          "signal-off"
        );

      }

    });

  }


  function updateSignals(zone) {

    const phase =
      getPhase(zone);

    if (
      phase === "green-ns"
    ) {

      setLight(
        zone,
        "north",
        "green"
      );

      setLight(
        zone,
        "south",
        "green"
      );

      setLight(
        zone,
        "east",
        "red"
      );

      setLight(
        zone,
        "west",
        "red"
      );

    }

    else if (
      phase === "yellow-ns"
    ) {

      setLight(
        zone,
        "north",
        "yellow"
      );

      setLight(
        zone,
        "south",
        "yellow"
      );

      setLight(
        zone,
        "east",
        "red"
      );

      setLight(
        zone,
        "west",
        "red"
      );

    }

    else if (
      phase === "green-ew"
    ) {

      setLight(
        zone,
        "north",
        "red"
      );

      setLight(
        zone,
        "south",
        "red"
      );

      setLight(
        zone,
        "east",
        "green"
      );

      setLight(
        zone,
        "west",
        "green"
      );

    }

    else {

      setLight(
        zone,
        "north",
        "red"
      );

      setLight(
        zone,
        "south",
        "red"
      );

      setLight(
        zone,
        "east",
        "yellow"
      );

      setLight(
        zone,
        "west",
        "yellow"
      );

    }

  }


  /* --------------------------------------------------------- */
  /* Car colors                                                */
  /* --------------------------------------------------------- */

  function randomCarColor() {

    const colors = [
      "#60a5fa",
      "#f97316",
      "#e5e7eb",
      "#a78bfa",
      "#f43f5e",
      "#34d399"
    ];

    return colors[
      Math.floor(
        Math.random() *
        colors.length
      )
    ];

  }


  /* --------------------------------------------------------- */
  /* Starting positions                                       */
  /* --------------------------------------------------------- */

  function startingPosition(
    direction,
    laneOffset
  ) {

    if (
      direction === "north"
    ) {

      return {
        x: 177 + laneOffset,
        y: 35
      };

    }

    if (
      direction === "south"
    ) {

      return {
        x: 177 + laneOffset,
        y: 302
      };

    }

    if (
      direction === "east"
    ) {

      return {
        x: 370,
        y: 164 + laneOffset
      };

    }

    return {
      x: -20,
      y: 164 + laneOffset
    };

  }


  /* --------------------------------------------------------- */
  /* Create a car                                               */
  /* --------------------------------------------------------- */

  function createCar(
    zone,
    direction
  ) {

    const group =
      document.getElementById(
        "cars-" + zone
      );

    if (!group) {
      return null;
    }

    const state =
      zoneState[zone];

    const laneOffset =
      Math.random() > 0.5
        ? -13
        : 13;

    const position =
      startingPosition(
        direction,
        laneOffset
      );

    const car =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "rect"
      );

    car.setAttribute(
      "class",
      "car"
    );

    car.setAttribute(
      "width",
      direction === "north" ||
      direction === "south"
        ? "9"
        : "18"
    );

    car.setAttribute(
      "height",
      direction === "north" ||
      direction === "south"
        ? "18"
        : "9"
    );

    car.setAttribute(
      "fill",
      randomCarColor()
    );

    car.setAttribute(
      "x",
      position.x
    );

    car.setAttribute(
      "y",
      position.y
    );

    group.appendChild(
      car
    );

    const carState = {
      element: car,

      direction: direction,

      x: position.x,

      y: position.y,

      speed:
        35 +
        Math.random() * 25,

      laneOffset,

      stopped: false
    };

    state.cars.push(
      carState
    );

    return carState;

  }


  /* --------------------------------------------------------- */
  /* Determine whether a new car can enter                     */
  /* --------------------------------------------------------- */

  function canSpawnCar(
    zone,
    direction
  ) {

    const state =
      zoneState[zone];

    const sameDirectionCars =
      state.cars.filter(
        car =>
          car.direction ===
          direction
      );

    for (
      const car of sameDirectionCars
    ) {

      if (
        direction === "north" &&
        car.y < 85
      ) {
        return false;
      }

      if (
        direction === "south" &&
        car.y > 250
      ) {
        return false;
      }

      if (
        direction === "west" &&
        car.x < 75
      ) {
        return false;
      }

      if (
        direction === "east" &&
        car.x > 295
      ) {
        return false;
      }

    }

    return true;

  }


  /* --------------------------------------------------------- */
  /* Spawn traffic                                             */
  /* --------------------------------------------------------- */

  function spawnTraffic(
    zone
  ) {

    const state =
      zoneState[zone];

    const demand =
      getTrafficDemand(zone);

    /*
     * Never allow the screen to become ridiculous.
     */
    const desired =
      Math.min(
        12,
        demand
      );

    if (
      state.cars.length >= desired
    ) {
      return;
    }

    const now =
      Date.now();

    if (
      now -
      state.lastSpawn <
      state.spawnInterval
    ) {
      return;
    }

    state.lastSpawn = now;

    const directions = [
      "north",
      "south",
      "east",
      "west"
    ];

    /*
     * Bias traffic toward the currently
     * active direction.
     */
    const phase =
      getPhase(zone);

    let allowed = directions;

    if (
      phase === "green-ns" ||
      phase === "yellow-ns"
    ) {

      allowed = [
        "north",
        "south",
        "east",
        "west"
      ];

    }

    else if (
      phase === "green-ew" ||
      phase === "yellow-ew"
    ) {

      allowed = [
        "east",
        "west",
        "north",
        "south"
      ];

    }

    for (
      let attempt = 0;
      attempt < 8;
      attempt++
    ) {

      const direction =
        allowed[
          Math.floor(
            Math.random() *
            allowed.length
          )
        ];

      if (
        canSpawnCar(
          zone,
          direction
        )
      ) {

        createCar(
          zone,
          direction
        );

        return;

      }

    }

  }


  /* --------------------------------------------------------- */
  /* Movement / stopping logic                                 */
  /* --------------------------------------------------------- */

  function updateCars(
    zone,
    deltaSeconds
  ) {

    const state =
      zoneState[zone];

    const cars =
      state.cars;

    const stopLines = {
      north: 105,
      south: 240,
      west: 120,
      east: 250
    };

    for (
      let i = 0;
      i < cars.length;
      i++
    ) {

      const car =
        cars[i];

      const canMove =
        directionPermission(
          zone,
          car.direction
        );

      /*
       * Default movement.
       */
      let speed =
        car.speed;

      /*
       * Yellow = slower movement.
       */
      const phase =
        getPhase(zone);

      if (
        phase === "yellow-ns" ||
        phase === "yellow-ew"
      ) {

        speed *= 0.55;

      }

      /*
       * Check the signal.
       */
      if (!canMove) {

        if (
          car.direction === "north" &&
          car.y >= stopLines.north
        ) {

          speed = 0;

        }

        else if (
          car.direction === "south" &&
          car.y <= stopLines.south
        ) {

          speed = 0;

        }

        else if (
          car.direction === "west" &&
          car.x >= stopLines.west
        ) {

          speed = 0;

        }

        else if (
          car.direction === "east" &&
          car.x <= stopLines.east
        ) {

          speed = 0;

        }

      }

      /*
       * Prevent cars from driving into
       * the back of another car.
       */
      for (
        let j = 0;
        j < cars.length;
        j++
      ) {

        if (i === j) {
          continue;
        }

        const other =
          cars[j];

        if (
          other.direction !==
          car.direction
        ) {
          continue;
        }

        let distance = Infinity;

        if (
          car.direction === "north"
        ) {

          if (
            other.y > car.y
          ) {

            distance =
              other.y -
              car.y;

          }

        }

        else if (
          car.direction === "south"
        ) {

          if (
            other.y < car.y
          ) {

            distance =
              car.y -
              other.y;

          }

        }

        else if (
          car.direction === "west"
        ) {

          if (
            other.x > car.x
          ) {

            distance =
              other.x -
              car.x;

          }

        }

        else if (
          car.direction === "east"
        ) {

          if (
            other.x < car.x
          ) {

            distance =
              car.x -
              other.x;

          }

        }

        /*
         * Maintain following distance.
         */
        if (
          distance < 28
        ) {

          speed = 0;

        }

      }

      /*
       * Move car.
       */
      if (speed > 0) {

        const movement =
          speed *
          deltaSeconds;

        if (
          car.direction === "north"
        ) {

          car.y += movement;

        }

        else if (
          car.direction === "south"
        ) {

          car.y -= movement;

        }

        else if (
          car.direction === "west"
        ) {

          car.x += movement;

        }

        else {

          car.x -= movement;

        }

      }

      /*
       * Update SVG position.
       */
      car.element.setAttribute(
        "x",
        car.x
      );

      car.element.setAttribute(
        "y",
        car.y
      );

    }

    /*
     * Remove cars that have left
     * the intersection.
     */
    state.cars =
      state.cars.filter(car => {

        const outside =
          car.x < -50 ||
          car.x > 420 ||
          car.y < -50 ||
          car.y > 360;

        if (outside) {

          car.element.remove();

          return false;

        }

        return true;

      });

  }


  /* --------------------------------------------------------- */
  /* Status / VMS                                             */
  /* --------------------------------------------------------- */

  function updateMessages(
    zone
  ) {

    const queue =
      getTrafficDemand(zone);

    const phase =
      getPhase(zone);

    let direction =
      "ALL DIRECTIONS";

    if (
      phase === "green-ns" ||
      phase === "yellow-ns"
    ) {

      direction =
        "NORTH / SOUTH";

    }

    else {

      direction =
        "EAST / WEST";

    }

    let trafficLevel =
      "NORMAL TRAFFIC";

    if (
      queue >= 8
    ) {

      trafficLevel =
        "HEAVY TRAFFIC";

    }

    else if (
      queue >= 5
    ) {

      trafficLevel =
        "MODERATE TRAFFIC";

    }

    const message =
      document.getElementById(
        "message-" + zone
      );

    if (message) {

      message.textContent =
        "VMS: " +
        trafficLevel +
        " — " +
        direction;

    }

    const status =
      document.getElementById(
        "status-" + zone
      );

    if (status) {

      status.textContent =
        direction +
        " ACTIVE — " +
        queue +
        " VEHICLES EXPECTED";

    }

    const operations =
      document.getElementById(
        "ops-" + zone
      );

    if (operations) {

      operations.textContent =
        trafficZones[zone].name +
        ": " +
        queue +
        " VEHICLES / " +
        direction;

    }

  }


  /* --------------------------------------------------------- */
  /* Main animation loop                                       */
  /* --------------------------------------------------------- */

  let lastFrame =
    performance.now();

  function animate(now) {

    const deltaSeconds =
      Math.min(
        0.05,
        (now - lastFrame) / 1000
      );

    lastFrame = now;

    Object.keys(
      trafficZones
    ).forEach(zone => {

      updateTrafficDemand(
        zone
      );

      updateSignals(
        zone
      );

      spawnTraffic(
        zone
      );

      updateCars(
        zone,
        deltaSeconds
      );

      updateMessages(
        zone
      );

    });

    const update =
      document.getElementById(
        "last-update"
      );

    if (update) {

      update.textContent =
        "Last update: " +
        new Date().toLocaleTimeString();

    }

    requestAnimationFrame(
      animate
    );

  }

  requestAnimationFrame(
    animate
  );
</script>

</svg>
{% endblock %}
