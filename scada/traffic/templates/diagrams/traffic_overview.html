{% extends "diagram_base.html" %}
{% block diagram %}

<style>
  .traffic-screen {
    font-family: Arial, Helvetica, sans-serif;
  }

  .traffic-title {
    font-size: 28px;
    font-weight: bold;
    fill: #ffffff;
    letter-spacing: 1px;
  }

  .traffic-subtitle {
    font-size: 13px;
    fill: #cbd5e1;
  }

  .zone-title {
    font-size: 18px;
    font-weight: bold;
    fill: #ffffff;
  }

  .zone-status {
    font-size: 13px;
    font-weight: bold;
    fill: #d1d5db;
  }

  .road {
    fill: #30343b;
    stroke: #111827;
    stroke-width: 2;
  }

  .road-line {
    stroke: #f8fafc;
    stroke-width: 3;
    stroke-dasharray: 18 14;
    opacity: 0.8;
  }

  .lane-line {
    stroke: #e5e7eb;
    stroke-width: 2;
    opacity: 0.65;
  }

  .intersection {
    fill: #20242a;
    stroke: #111827;
    stroke-width: 2;
  }

  .grass {
    fill: #687442;
  }

  .signal-housing {
    fill: #171717;
    stroke: #9ca3af;
    stroke-width: 1;
  }

  .signal-light {
    stroke: #111827;
    stroke-width: 2;
  }

  .signal-red {
    fill: #ef4444;
  }

  .signal-yellow {
    fill: #facc15;
  }

  .signal-green {
    fill: #22c55e;
  }

  .signal-off {
    fill: #374151;
  }

  .car {
    rx: 5;
    ry: 5;
    stroke: #111827;
    stroke-width: 1;
  }

  .sensor-panel {
    fill: #111827;
    stroke: #475569;
    stroke-width: 1;
  }

  .sensor-heading {
    font-size: 11px;
    font-weight: bold;
    fill: #94a3b8;
  }

  .sensor-value {
    font-size: 17px;
    font-weight: bold;
    fill: #ffffff;
  }

  .sensor-unit {
    font-size: 10px;
    fill: #94a3b8;
  }

  .message-panel {
    fill: #172033;
    stroke: #475569;
    stroke-width: 1;
  }

  .message-text {
    font-size: 12px;
    font-weight: bold;
    fill: #f8fafc;
  }

  .header-panel {
    fill: #111827;
    stroke: #334155;
    stroke-width: 1;
  }

  .system-ok {
    fill: #22c55e;
  }
</style>

  {% endmacro %}

  <!-- ========================================================= -->
  <!-- FOUR TRAFFIC ZONES -->
  <!-- ========================================================= -->

  {{ intersection(

      20,
      105
  ) }}

  {{ intersection(
      "us35",
      "US-35",
      "CAM-201",
      "LOOP-201",
      "SIGNAL-201",
      "VMS-201",
      405,
      105
  ) }}

  {{ intersection(
      "sr48",
      "SR-48",
      "CAM-301",
      "LOOP-301",
      "SIGNAL-301",
      "VMS-301",
      790,
      105
  ) }}

  {{ intersection(
      "downtown",
      "DOWNTOWN",
      "CAM-401",
      "LOOP-401",
      "SIGNAL-401",
      "VMS-401",
      1175,
      105
  ) }}

  <!-- ========================================================= -->
  <!-- OPERATIONS STATUS -->
  <!-- ========================================================= -->

  <rect
    class="header-panel"
    x="20"
    y="650"
    width="1560"
    height="235"
    rx="10"
  />

  <text
    class="zone-title"
    x="800"
    y="682"
    text-anchor="middle"
  >
    TRAFFIC CONTROL STATUS
  </text>

  <text
    id="ops-i75"
    class="zone-status"
    x="120"
    y="720"
  >
    I-75: INITIALIZING
  </text>

  <text
    id="ops-us35"
    class="zone-status"
    x="520"
    y="720"
  >
    US-35: INITIALIZING
  </text>

  <text
    id="ops-sr48"
    class="zone-status"
    x="920"
    y="720"
  >
    SR-48: INITIALIZING
  </text>

  <text
    id="ops-downtown"
    class="zone-status"
    x="1320"
    y="720"
  >
    DOWNTOWN: INITIALIZING

  <text
    class="traffic-subtitle"
    x="800"
    y="775"
    text-anchor="middle"

  </text>

  <text
    class="traffic-subtitle"
    x="800"
    y="800"
    text-anchor="middle"
  >
    Vehicle queues vary continuously to simulate changing traffic conditions.
  </text>

  <text
    id="last-update"
    class="traffic-subtitle"
    x="800"
    y="840"
    text-anchor="middle"
  >
    Last update: —
  </text>

  <!-- ========================================================= -->
  <!-- JAVASCRIPT -->
  <!-- ========================================================= -->

  <script>
    const trafficZones = {
      i75: {
        name: "I-75",
        loopTag: "LOOP-101"
      },

      us35: {
        name: "US-35",
        loopTag: "LOOP-201"
      },

      sr48: {
        name: "SR-48",
        loopTag: "LOOP-301"
      },

      downtown: {
        name: "DOWNTOWN",
        loopTag: "LOOP-401"
      }
    };

    const zoneState = {};

    function createZoneState() {
      const now = Date.now();

      return {
        cycleStart:
          now -
          Math.floor(
            Math.random() * 15000
          ),

        phaseOffset:
          Math.floor(
            Math.random() * 15000
          ),

        cycleLength: 30000,

        queue:
          Math.floor(
            Math.random() * 8
          ) + 1,

        targetQueue:
          Math.floor(
            Math.random() * 8
          ) + 1,

        lastQueueUpdate: now
      };
    }

    Object.keys(
      trafficZones
    ).forEach(zone => {
      zoneState[zone] =
        createZoneState();
    });

    function getNumericSensorValue(tag) {
      const element =
        document.getElementById(
          "val-" + tag
        );

      if (!element) {
        return null;
      }

      const raw =
        element.textContent.trim();

      if (
        !raw ||
        raw === "—"
      ) {
        return null;
      }

      const numeric =
        parseFloat(raw);

      return Number.isFinite(numeric)
        ? numeric
        : null;
    }

    function getTrafficQueue(zone) {
      const config =
        trafficZones[zone];

      const liveValue =
        getNumericSensorValue(
          config.loopTag
        );

      if (liveValue !== null) {
        return Math.max(
          0,
          Math.min(
            12,
            Math.round(liveValue)
          )
        );
      }

      return zoneState[zone].queue;
    }

    function updateQueue(zone) {
      const state =
        zoneState[zone];

      const now =
        Date.now();

      if (
        now -
        state.lastQueueUpdate <
        4000
      ) {
        return;
      }

      state.lastQueueUpdate = now;

      const change =
        Math.floor(
          Math.random() * 5
        ) - 2;

      state.targetQueue =
        Math.max(
          0,
          Math.min(
            12,
            state.queue + change
          )
        );

      if (
        state.queue <
        state.targetQueue
      ) {
        state.queue++;
      }

      else if (
        state.queue >
        state.targetQueue
      ) {
        state.queue--;
      }
    }

    function getPhase(zone) {
      const state =
        zoneState[zone];

      const elapsed =
        (
          Date.now() -
          state.cycleStart +
          state.phaseOffset
        ) %
        state.cycleLength;

      if (
        elapsed < 12000
      ) {
        return "green-ns";
      }

      if (
        elapsed < 15000
      ) {
        return "yellow-ns";
      }

      if (
        elapsed < 27000
      ) {
        return "green-ew";
      }

      if (
        elapsed < 30000
      ) {
        return "yellow-ew";
      }

      return "red-all";
    }

    function setLight(
      zone,
      direction,
      color
    ) {
      const colors = [
        "red",
        "yellow",
        "green"
      ];

      colors.forEach(
        lightColor => {

          const element =
            document.getElementById(
              "light-" +
              zone +
              "-" +
              direction +
              "-" +
              lightColor
            );

          if (!element) {
            return;
          }

          element.classList.remove(
            "signal-red",
            "signal-yellow",
            "signal-green",
            "signal-off"
          );

          if (
            lightColor === color
          ) {
            element.classList.add(
              "signal-" +
              color
            );
          }

          else {
            element.classList.add(
              "signal-off"
            );
          }
        }
      );
    }

    function updateSignals(zone) {
      const phase =
        getPhase(zone);

      if (
        phase === "green-ns"
      ) {
        setLight(
          zone,
          "north",
          "green"
        );

        setLight(
          zone,
          "south",
          "green"
        );

        setLight(
          zone,
          "east",
          "red"
        );

        setLight(
          zone,
          "west",
          "red"
        );
      }

      else if (
        phase === "yellow-ns"
      ) {
        setLight(
          zone,
          "north",
          "yellow"
        );

        setLight(
          zone,
          "south",
          "yellow"
        );

        setLight(
          zone,
          "east",
          "red"
        );

        setLight(
          zone,
          "west",
          "red"
        );
      }

      else if (
        phase === "green-ew"
      ) {
        setLight(
          zone,
          "north",
          "red"
        );

        setLight(
          zone,
          "south",
          "red"
        );

        setLight(
          zone,
          "east",
          "green"
        );

        setLight(
          zone,
          "west",
          "green"
        );
      }

      else if (
        phase === "yellow-ew"
      ) {
        setLight(
          zone,
          "north",
          "red"
        );

        setLight(
          zone,
          "south",
          "red"
        );

        setLight(
          zone,
          "east",
          "yellow"
        );

        setLight(
          zone,
          "west",
          "yellow"
        );
      }

      else {
        setLight(
          zone,
          "north",
          "red"
        );

        setLight(
          zone,
          "south",
          "red"
        );

        setLight(
          zone,
          "east",
          "red"
        );

        setLight(
          zone,
          "west",
          "red"
        );
      }
    }

    function createCars(zone) {
      const group =
        document.getElementById(
          "cars-" + zone
        );

      if (!group) {
        return;
      }

      while (
        group.firstChild
      ) {
        group.removeChild(
          group.firstChild
        );
      }

      const count =
        getTrafficQueue(zone);

      for (
        let i = 0;
        i < count;
        i++
      ) {
        const direction =
          i % 4;

        const car =
          document.createElementNS(
            "http://www.w3.org/2000/svg",
            "rect"
          );

        car.setAttribute(
          "class",
          "car"
        );

        car.setAttribute(
          "width",
          "17"
        );

        car.setAttribute(
          "height",
          "9"
        );

        let x = 0;
        let y = 0;

        if (
          direction === 0
        ) {
          x =
            72 +
            (i % 3) * 19;

          y =
            135 +
            Math.floor(
              i / 4
            ) * 15;
        }

        else if (
          direction === 1
        ) {
          x =
            270 +
            (i % 3) * 19;

          y =
            185 -
            Math.floor(
              i / 4
            ) * 15;
        }

        else if (
          direction === 2
        ) {
          x =
            168 +
            Math.floor(
              i / 4
            ) * 15;

          y =
            55 +
            (i % 3) * 19;
        }

        else {
          x =
            192 -
            Math.floor(
              i / 4
            ) * 15;

          y =
            240 +
            (i % 3) * 19;
        }

        car.setAttribute(
          "x",
          x
        );

        car.setAttribute(
          "y",
          y
        );

        const variation =
          i % 3;

        if (
          variation === 0
        ) {
          car.setAttribute(
            "fill",
            "#60a5fa"
          );
        }

        else if (
          variation === 1
        ) {
          car.setAttribute(
            "fill",
            "#f97316"
          );
        }

        else {
          car.setAttribute(
            "fill",
            "#e5e7eb"
          );
        }

        group.appendChild(
          car
        );
      }
    }

    function updateMessages(zone) {
      const messageElement =
        document.getElementById(
          "message-" + zone
        );

      const statusElement =
        document.getElementById(
          "status-" + zone
        );

      const opsElement =
        document.getElementById(
          "ops-" + zone
        );

      const queue =
        getTrafficQueue(zone);

      const phase =
        getPhase(zone);

      let direction =
        "ALL DIRECTIONS";

      if (
        phase === "green-ns" ||
        phase === "yellow-ns"
      ) {
        direction =
          "NORTH / SOUTH";
      }

      else if (
        phase === "green-ew" ||
        phase === "yellow-ew"
      ) {
        direction =
          "EAST / WEST";
      }

      let trafficLevel =
        "NORMAL TRAFFIC";

      if (
        queue >= 8
      ) {
        trafficLevel =
          "HEAVY TRAFFIC";
      }

      else if (
        queue >= 5
      ) {
        trafficLevel =
          "MODERATE TRAFFIC";
      }

      if (messageElement) {
        messageElement.textContent =
          "VMS: " +
          trafficLevel +
          " — " +
          direction;
      }

      if (statusElement) {
        statusElement.textContent =
          direction +
          " ACTIVE — " +
          queue +
          " VEHICLES WAITING";
      }

      if (opsElement) {
        opsElement.textContent =
          trafficZones[zone].name +
          ": " +
          queue +
          " VEHICLES / " +
          direction;
      }
    }

    function updateSystemStatus() {
      const updateElement =
        document.getElementById(
          "last-update"
        );

      if (updateElement) {
        updateElement.textContent =
          "Last update: " +
          new Date().toLocaleTimeString();
      }
    }

    function updateDiagram() {
      Object.keys(
        trafficZones
      ).forEach(zone => {
        updateQueue(zone);
        updateSignals(zone);
        createCars(zone);
        updateMessages(zone);
      });

      updateSystemStatus();
    }

    updateDiagram();

    setInterval(
      updateDiagram,
      1000
    );
  </script>

</svg>

{% endblock %}
