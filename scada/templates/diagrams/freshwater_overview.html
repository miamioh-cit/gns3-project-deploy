{% extends "diagram_base.html" %}
{% block diagram %}
{% macro sensor(tag, desc, unit, x, y, w, lead, cls='leader-blue') -%}
<g class="sensor-box" id="box-{{ tag }}">
  <rect x="{{ x }}" y="{{ y }}" width="{{ w }}" height="56"/>
  <text class="sensor-tag" x="{{ x + 12 }}" y="{{ y + 17 }}">{{ tag }}</text>
  <text class="sensor-desc" x="{{ x + 12 }}" y="{{ y + 31 }}">{{ desc }}</text>
  <text class="sensor-value" x="{{ x + 12 }}" y="{{ y + 51 }}" id="val-{{ tag }}">—</text>
  {% if unit %}<text class="sensor-unit" x="{{ x + w - 38 }}" y="{{ y + 51 }}">{{ unit }}</text>{% endif %}
</g>
<path class="leader {{ cls }}" d="{{ lead }}"/>
{%- endmacro %}

<svg viewBox="0 0 1600 760" class="pid-svg" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#172233"/><stop offset="50%" stop-color="#223650"/><stop offset="100%" stop-color="#172233"/></linearGradient>
    <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2385d0" stop-opacity="0.82"/><stop offset="100%" stop-color="#0e3c64" stop-opacity="0.62"/></linearGradient>
    <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bc8cff" stop-opacity="0.70"/><stop offset="100%" stop-color="#4c2a08" stop-opacity="0.72"/></linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- main process line: raw water -> intake -> filtration -> dosing -> storage -> finished water -->
  <path class="eq-pipe" d="M 20 304 H 90 M 180 304 H 245 M 335 304 H 405 M 465 304 H 535 M 690 304 H 760 M 900 304 H 970 M 1060 304 H 1130 M 1415 304 H 1550"/>
  <path class="eq-pipe-flow" d="M 20 304 H 90 M 180 304 H 245 M 335 304 H 405 M 465 304 H 535 M 690 304 H 760 M 900 304 H 970 M 1060 304 H 1130 M 1415 304 H 1550"/>
  <polygon points="16,297 31,304 16,311" fill="#58a6ff"/><text x="18" y="286" fill="#58a6ff" font-size="11" font-weight="800">RAW WATER</text>
  <polygon points="1547,297 1562,304 1547,311" fill="#7ee787"/><text x="1480" y="286" fill="#7ee787" font-size="11" font-weight="800">FINISHED WATER</text>

  <!-- raw water intake basin -->
  <rect class="eq-tank" x="90" y="230" width="90" height="150" rx="5"/>
  <rect class="eq-tank-fill" id="fill-LT-INTAKE" x="93" y="302" width="84" height="75" data-tankh="144" data-tanky="233"/>
  <line x1="102" y1="238" x2="102" y2="370" stroke="#8fa8c4" opacity=".35"/><line x1="168" y1="238" x2="168" y2="370" stroke="#8fa8c4" opacity=".35"/>
  <text x="135" y="405" class="eq-label">Raw Water Intake</text>

  <!-- intake screen -->
  <rect x="245" y="264" width="90" height="80" rx="4" fill="url(#tg)" stroke="#9fb1c7" stroke-width="2"/>
  {% for i in range(8) %}<line x1="255" y1="272" x2="255" y2="336" stroke="#75869a" opacity=".45" transform="translate({{ i*9 }},0)"/>{% endfor %}
  <text x="290" y="371" class="eq-label">Intake Screen</text>

  <!-- intake pump -->
  <g id="pump-P-INTAKE"><circle class="eq-pump-body" cx="435" cy="304" r="30"/><g class="eq-pump-blade" style="transform-origin:435px 304px;"><line x1="435" y1="278" x2="435" y2="330"/><line x1="409" y1="304" x2="461" y2="304"/></g></g>
  <text x="435" y="352" class="eq-label">P-INTAKE</text>

  <!-- filtration train -->
  <rect class="eq-tank" x="535" y="246" width="155" height="116" rx="5"/>
  <rect class="eq-tank-fill" id="fill-LT-FILTRATION" x="538" y="296" width="149" height="63" data-tankh="110" data-tanky="249"/>
  {% for y in [268,288,308,328,348] %}<line x1="545" y1="{{ y }}" x2="680" y2="{{ y }}" stroke="#8fa8c4" opacity=".28"/>{% endfor %}
  {% for x in [565,610,655] %}<line x1="{{ x }}" y1="250" x2="{{ x }}" y2="358" stroke="#8fa8c4" opacity=".24"/>{% endfor %}
  <text x="612" y="392" class="eq-label">Filtration</text>

  <!-- filtered water contact chamber -->
  <rect class="eq-tank" x="760" y="246" width="140" height="116" rx="5"/>
  <rect class="eq-tank-fill" x="763" y="296" width="134" height="63"/>
  {% for x in [790,835,880] %}<line x1="{{ x }}" y1="250" x2="{{ x }}" y2="358" stroke="#8fa8c4" opacity=".30"/>{% endfor %}
  {% for i in range(10) %}<circle cx="{{ 775 + (i*19)%110 }}" cy="{{ 270 + (i*17)%72 }}" r="2" fill="#8ac7ff" opacity=".35"/>{% endfor %}
  <text x="830" y="392" class="eq-label">Filter Gallery</text>

  <!-- chemical dosing tank -->
  <rect class="eq-tank" x="970" y="252" width="90" height="106" rx="5"/>
  <rect class="eq-tank-fill" x="973" y="300" width="84" height="55" fill="url(#cg)"/>
  <line x1="1015" y1="260" x2="1015" y2="350" stroke="#c8d3df" opacity=".42"/>
  <text x="1015" y="392" class="eq-label">Dosing Tank</text>

  <!-- chemical injection pump -->
  <path class="eq-pipe" d="M 930 430 V 318 H 970"/>
  <path class="eq-pipe-flow chem-flow" d="M 930 430 V 318 H 970"/>
  <g id="pump-P-DOSE"><circle class="eq-pump-body" cx="930" cy="430" r="25"/><g class="eq-pump-blade" style="transform-origin:930px 430px;"><line x1="930" y1="408" x2="930" y2="452"/><line x1="908" y1="430" x2="952" y2="430"/></g></g>
  <text x="930" y="470" class="eq-label">P-DOSE</text>

  <!-- finished water storage -->
  <ellipse class="eq-tank" cx="1270" cy="245" rx="145" ry="21"/>
  <rect class="eq-tank" x="1125" y="245" width="290" height="110"/>
  <rect class="eq-tank-fill" id="fill-LT-STORAGE" x="1128" y="292" width="284" height="60" data-tankh="104" data-tanky="248"/>
  <ellipse class="eq-tank" cx="1270" cy="355" rx="145" ry="20"/>
  {% for x in [1180,1230,1280,1330,1380] %}<line x1="{{ x }}" y1="251" x2="{{ x }}" y2="349" stroke="#8fa8c4" opacity=".22"/>{% endfor %}
  <text x="1270" y="392" class="eq-label">Finished Water Storage</text>

  <!-- distribution valve -->
  <path class="eq-pipe" d="M 1415 304 H 1480 V 235 H 1540"/>
  <g id="valve-OUT" class="eq-valve-closed"><polygon class="eq-valve-body" points="1468,304 1480,292 1480,316"/><polygon class="eq-valve-body" points="1492,304 1480,292 1480,316"/></g>

  <!-- lower auxiliary/backwash process -->
  <path class="eq-pipe" d="M 290 344 V 520 H 510 M 610 520 H 760 M 830 520 H 970 M 1040 520 H 1190"/>
  <path class="eq-pipe-flow" d="M 290 344 V 520 H 510 M 610 520 H 760 M 830 520 H 970 M 1040 520 H 1190"/>
  <text x="315" y="505" fill="#f28b28" font-size="12" font-weight="800">BACKWASH</text>
  <text x="1070" y="505" fill="#bc8cff" font-size="12" font-weight="800">CHEMICAL FEED</text>

  <!-- backwash tank -->
  <rect class="eq-tank" x="510" y="465" width="100" height="80"/>
  <rect class="eq-tank-fill" x="513" y="503" width="94" height="39"/>
  <text x="560" y="572" class="eq-label">Backwash Tank</text>

  <!-- backwash pump -->
  <g id="pump-P-BW"><circle class="eq-pump-body" cx="790" cy="520" r="28"/><g class="eq-pump-blade" style="transform-origin:790px 520px;"><line x1="790" y1="496" x2="790" y2="544"/><line x1="766" y1="520" x2="814" y2="520"/></g></g>
  <text x="790" y="564" class="eq-label">P-BW</text>

  <!-- chemical feed skid -->
  <rect x="970" y="465" width="140" height="80" rx="5" fill="url(#tg)" stroke="#aab8ca" stroke-width="2"/>
  {% for x in [995,1035,1075] %}<circle cx="{{ x }}" cy="505" r="18" fill="none" stroke="#9aacc2" stroke-width="2"/>{% endfor %}
  <text x="1040" y="572" class="eq-label">Chemical Feed Skid</text>

  <!-- finished-water outlet pump -->
  <g id="pump-P-OUT"><circle class="eq-pump-body" cx="1215" cy="520" r="28"/><g class="eq-pump-blade" style="transform-origin:1215px 520px;"><line x1="1215" y1="496" x2="1215" y2="544"/><line x1="1191" y1="520" x2="1239" y2="520"/></g></g>
  <text x="1215" y="564" class="eq-label">P-OUT</text>

  <!-- instrument dots -->
  <circle class="leader-dot" cx="135" cy="235" fill="#58a6ff"/>
  <circle class="leader-dot" cx="135" cy="300" fill="#58a6ff"/>
  <circle class="leader-dot" cx="290" cy="288" fill="#ffbd2e"/>
  <circle class="leader-dot" cx="435" cy="304" fill="#7ee787"/>
  <circle class="leader-dot" cx="612" cy="318" fill="#58a6ff"/>
  <circle class="leader-dot" cx="650" cy="318" fill="#ffbd2e"/>
  <circle class="leader-dot" cx="830" cy="318" fill="#58a6ff"/>
  <circle class="leader-dot" cx="875" cy="318" fill="#bc8cff"/>
  <circle class="leader-dot" cx="1015" cy="318" fill="#bc8cff"/>
  <circle class="leader-dot" cx="930" cy="430" fill="#bc8cff"/>
  <circle class="leader-dot" cx="1270" cy="305" fill="#58a6ff"/>
  <circle class="leader-dot" cx="1380" cy="318" fill="#7ee787"/>
  <circle class="leader-dot" cx="560" cy="505" fill="#f28b28"/>
  <circle class="leader-dot" cx="790" cy="520" fill="#f28b28"/>
  <circle class="leader-dot" cx="1040" cy="505" fill="#bc8cff"/>

  <!-- VLAN / section pills -->
  <g class="section-pill"><rect x="70" y="420" width="180" height="25" rx="4"/><text class="vlan" x="83" y="437">VLAN 10</text><text x="142" y="437">Raw Intake</text></g>
  <g class="section-pill"><rect x="265" y="420" width="195" height="25" rx="4"/><text class="vlan" x="278" y="437">VLAN 20</text><text x="340" y="437">Pre-Treatment</text></g>
  <g class="section-pill"><rect x="485" y="420" width="190" height="25" rx="4"/><text class="vlan" x="498" y="437">VLAN 30</text><text x="560" y="437">Filtration</text></g>
  <g class="section-pill"><rect x="705" y="420" width="185" height="25" rx="4"/><text class="vlan" x="718" y="437">VLAN 40</text><text x="780" y="437">Dosing</text></g>
  <g class="section-pill"><rect x="920" y="420" width="205" height="25" rx="4"/><text class="vlan" x="933" y="437" fill="#bc8cff">VLAN 50</text><text x="995" y="437">Conditioning</text></g>
  <g class="section-pill"><rect x="1145" y="420" width="225" height="25" rx="4"/><text class="vlan" x="1158" y="437" fill="#7ee787">VLAN 60</text><text x="1220" y="437">Storage</text></g>

  <!-- top sensor row: one instance of each actual live tag -->
  {{ sensor('FT-INTAKE','FLOW','gpm', 20, 22, 118, 'M 79 78 V 205 H 55 V 304', 'leader-blue') }}
  {{ sensor('LT-INTAKE','LEVEL','%', 150, 22, 118, 'M 209 78 V 205 H 135 V 235', 'leader-blue') }}
  {{ sensor('DP-INTAKE','PRESSURE','psi', 280, 22, 126, 'M 343 78 V 214 H 290 V 288', 'leader-yellow') }}
  {{ sensor('TU-INTAKE','TURBIDITY','NTU', 418, 22, 126, 'M 481 78 V 190 H 290 V 288', 'leader-yellow') }}

  {{ sensor('TU-FILTRATION','TURBIDITY','NTU', 556, 22, 130, 'M 621 78 V 190 H 650 V 318', 'leader-yellow') }}
  {{ sensor('DP-FILTRATION','PRESSURE','psi', 699, 22, 126, 'M 762 78 V 198 H 650 V 318', 'leader-yellow') }}
  {{ sensor('FT-FILTRATION','FLOW','gpm', 829, 22, 126, 'M 892 78 V 196 H 612 V 318', 'leader-blue') }}
  {{ sensor('LT-FILTRATION','LEVEL','%', 967, 22, 118, 'M 1026 78 V 190 H 612 V 300', 'leader-blue') }}

  {{ sensor('CL-DOSING','CHLORINE','mg/L', 1098, 22, 130, 'M 1163 78 V 190 H 1015 V 318', 'leader-green') }}
  {{ sensor('PH-DOSING','pH','pH', 1238, 22, 112, 'M 1294 78 V 194 H 930 V 430', 'leader-purple') }}
  {{ sensor('FT-DOSING','FLOW','gpm', 1362, 22, 120, 'M 1422 78 V 188 H 930 V 430', 'leader-blue') }}
  {{ sensor('FT-DOSE','DOSE RATE','L/h', 1492, 22, 100, 'M 1542 78 V 220 H 1015 V 318', 'leader-purple') }}

  <!-- storage sensor row; unique IDs, grouped close to the storage vessel -->
  {{ sensor('LT-STORAGE','LEVEL','%', 1090, 130, 108, 'M 1144 186 V 220 H 1270 V 305', 'leader-blue') }}
  {{ sensor('TU-STORAGE','TURBIDITY','NTU', 1210, 130, 118, 'M 1269 186 V 240 H 1200 V 320', 'leader-yellow') }}
  {{ sensor('CL-STORAGE','CHLORINE','mg/L', 1340, 130, 124, 'M 1402 186 V 240 H 1380 V 318', 'leader-green') }}
  {{ sensor('TT-STORAGE','TEMP','C', 1475, 130, 110, 'M 1530 186 V 250 H 1340 V 320', 'leader-purple') }}

</svg>
{% endblock %}
