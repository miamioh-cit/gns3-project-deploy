{% extends "diagram_base.html" %}
{% block diagram %}
{% macro meter(tag, desc, unit, x, y, w, lead, cls='leader-blue') -%}
<g class="sensor-box" id="box-{{ tag }}">
  <rect x="{{ x }}" y="{{ y }}" width="{{ w }}" height="56"/>
  <text class="sensor-tag" x="{{ x + 11 }}" y="{{ y + 17 }}">{{ tag }}</text>
  <text class="sensor-desc" x="{{ x + 11 }}" y="{{ y + 31 }}">{{ desc }}</text>
  <text class="sensor-value" x="{{ x + 11 }}" y="{{ y + 51 }}" id="val-{{ tag }}">—</text>
  {% if unit %}<text class="sensor-unit" x="{{ x + w - 34 }}" y="{{ y + 51 }}">{{ unit }}</text>{% endif %}
</g>
<path class="leader {{ cls }}" d="{{ lead }}"/>
{%- endmacro %}

<style>
  .grid-svg { font-family: Arial, Helvetica, sans-serif; }
  .grid-title { fill: #f8fafc; font-size: 24px; font-weight: 850; letter-spacing: 1.4px; }
  .grid-subtitle { fill: #9fb2c8; font-size: 11px; letter-spacing: .08em; }
  .grid-panel { fill: #111d2c; stroke: #55708d; stroke-width: 1.2; }
  .grid-section { fill: #15273a; stroke: #74b8e9; stroke-width: 2; }
  .grid-section-label { fill: #e6f4ff; font-size: 14px; font-weight: 800; text-anchor: middle; }
  .grid-section-note { fill: #8ea8c2; font-size: 10px; text-anchor: middle; }
  .bus { stroke: #88ccff; stroke-width: 8; stroke-linecap: round; }
  .bus-live { stroke: #58d26f; stroke-width: 3.5; stroke-dasharray: 14 9; animation: gridflow 1.25s linear infinite; }
  .line { stroke: #4e6680; stroke-width: 7; stroke-linecap: round; fill: none; }
  .line-live { stroke: #5ad3ff; stroke-width: 3; stroke-dasharray: 12 8; animation: gridflow 1.15s linear infinite; }
  .breaker { fill: #172131; stroke: #ffbd2e; stroke-width: 2.5; }
  .breaker-blade { stroke: #7ee787; stroke-width: 3; }
  .transformer { fill: #223650; stroke: #b8d9f4; stroke-width: 2; }
  .tower { fill: none; stroke: #a8c7e2; stroke-width: 2.4; }
  .tower-wire { stroke: #5ad3ff; stroke-width: 3; fill: none; }
  .monitor-box { fill: #15293b; stroke: #7ee787; stroke-width: 1.4; }
  .monitor-label { fill: #dfffe2; font-size: 10px; font-weight: 800; text-anchor: middle; }
  .zone-pill rect { fill: #101b2a; stroke: #425e78; stroke-width: 1; }
  .zone-pill text { fill: #c9d9e8; font-size: 10px; font-weight: 700; }
  .zone-pill .vlan { fill: #58a6ff; font-size: 11px; }
  .zone-pill .blocked { fill: #ff9b8c; font-size: 10px; }
  .leader { fill: none; stroke-width: 1.7; stroke-dasharray: 4 5; opacity: .85; }
  .leader-blue { stroke: #58a6ff; }
  .leader-green { stroke: #7ee787; }
  .leader-yellow { stroke: #ffbd2e; }
  .leader-purple { stroke: #bc8cff; }
  @keyframes gridflow { to { stroke-dashoffset: -22; } }
</style>

  <path d="M 600 285 H 725 M 815 285 H 940" stroke="#58d26f" stroke-width="3.5" stroke-dasharray="14 9"/>

  <path class="tower" d="M 1185 340 L 1217 224 L 1249 340 M 1195 286 H 1239 M 1191 314 H 1243"/>
  <path class="tower" d="M 1351 340 L 1383 224 L 1415 340 M 1361 286 H 1405 M 1357 314 H 1409"/>
  <path class="tower-wire" d="M 1217 229 Q 1300 180 1383 229"/>
  <path class="tower-wire" d="M 1217 247 Q 1300 204 1383 247"/>

  <g class="zone-pill">
    <rect x="990" y="495" width="310" height="60" rx="8"/>

    <text x="1008" y="539">PLCs only · TCP/502 target</text>
  </g>
  <text class="blocked" x="1332" y="525">Enterprise / DMZ / monitoring</text>
  <text class="blocked" x="1332" y="542">direct Modbus: DENIED</text>

  <!-- Live PLC tag cards -->
  {{ meter('VOLT-101','BUS VOLTAGE','kV', 35, 625, 185, 'M 128 625 V 560 H 202 V 320', 'leader-blue') }}
  {{ meter('FREQ-101','GRID FREQUENCY','Hz', 235, 625, 185, 'M 328 625 V 575 H 288 V 320', 'leader-purple') }}
  {{ meter('CURR-201','FEEDER CURRENT','A', 435, 625, 185, 'M 528 625 V 575 H 660 V 326', 'leader-blue') }}
  {{ meter('BRKR-201','BREAKER STATE','1=CLOSED', 635, 625, 185, 'M 728 625 V 575 H 770 V 326', 'leader-yellow') }}
  {{ meter('POWER-301','TIE POWER','MW', 835, 625, 185, 'M 928 625 V 575 H 1270 V 275', 'leader-green') }}
  {{ meter('TEMP-301','CONDUCTOR TEMP','C', 1035, 625, 185, 'M 1128 625 V 575 H 1380 V 275', 'leader-purple') }}
</svg>
{% endblock %}
