{% extends "diagram_base.html" %}
{% block diagram %}

{% macro sensor(tag, desc, unit, x, y, lead) -%}
<g class="sensor-box" id="box-{{ tag }}">
  <rect x="{{ x }}" y="{{ y }}" width="150" height="54"/>
  <text class="sensor-tag" x="{{ x + 10 }}" y="{{ y + 17 }}">{{ tag }}</text>
  <text class="sensor-desc" x="{{ x + 10 }}" y="{{ y + 32 }}">{{ desc }}</text>
  <text class="sensor-value" x="{{ x + 10 }}" y="{{ y + 48 }}" id="val-{{ tag }}">—</text>
  {% if unit %}<text class="sensor-unit" x="{{ x + 125 }}" y="{{ y + 48 }}">{{ unit }}</text>{% endif %}
</g>
<path class="leader leader-blue" d="{{ lead }}"/>
{%- endmacro %}

<svg viewBox="0 0 1600 760"
     xmlns="http://www.w3.org/2000/svg">

  <!-- TITLE -->
  <text class="eq-label" x="800" y="35" text-anchor="middle">
    MIAMI VALLEY TRAFFIC OPERATIONS
  </text>

  <rect class="section-pill" x="40" y="65" width="340" height="35" rx="8"/>
  <text class="eq-label" x="210" y="89" text-anchor="middle">I-75 TRAFFIC ZONE</text>

  <rect class="eq-pipe" x="150" y="125" width="120" height="55" rx="8"/>
  <text class="eq-label" x="210" y="158" text-anchor="middle">PLC-I75</text>

  <rect class="eq-pipe" x="160" y="205" width="100" height="45" rx="8"/>
  <text class="eq-label" x="210" y="233" text-anchor="middle">HMI-I75</text>

  {{ sensor("CAM-101", "Traffic Camera", "", 40, 280, "M170,180 L115,280") }}
  {{ sensor("LOOP-101", "Vehicle Loop", "veh", 200, 280, "M210,180 L275,280") }}
  {{ sensor("SIGNAL-101", "Signal State", "", 40, 355, "M170,180 L115,355") }}
