{% extends "diagram_base.html" %}
{% block diagram %}
{% macro sensor(tag,desc,unit,x,y,w,lead,cls='leader-blue') -%}
<g class="sensor-box" id="box-{{ tag }}"><rect x="{{ x }}" y="{{ y }}" width="{{ w }}" height="56"/><text class="sensor-tag" x="{{ x+10 }}" y="{{ y+17 }}">{{ tag }}</text><text class="sensor-desc" x="{{ x+10 }}" y="{{ y+31 }}">{{ desc }}</text><text class="sensor-value" x="{{ x+10 }}" y="{{ y+51 }}" id="val-{{ tag }}">—</text>{% if unit %}<text class="sensor-unit" x="{{ x+w-34 }}" y="{{ y+51 }}">{{ unit }}</text>{% endif %}</g><path class="leader {{ cls }}" d="{{ lead }}"/>
{%- endmacro %}

<style>
.mfg-svg{font-family:Arial,Helvetica,sans-serif}.mfg-title{fill:#fff;font-size:24px;font-weight:800}.mfg-subtitle{fill:#94a3b8;font-size:12px}.eq-body{fill:#172233;stroke:#9fb1c7;stroke-width:2}.eq-fill{fill:#35698f;opacity:.8}.robot-fill{fill:#5a3d7a;opacity:.8}.package-fill{fill:#8a5426;opacity:.8}.quality-fill{fill:#2d6a4f;opacity:.8}.eq-pipe{fill:none;stroke:#64748b;stroke-width:8;stroke-linecap:round}.eq-pipe-flow{fill:none;stroke:#58a6ff;stroke-width:3;stroke-dasharray:12 9}.eq-label{fill:#d1d5db;font-size:12px;font-weight:800;text-anchor:middle}.status-panel{fill:#111827;stroke:#334155;stroke-width:1}.status-ok{fill:#22c55e}.section-pill rect{fill:#172033;stroke:#475569;stroke-width:1}.section-pill text{fill:#d1d5db;font-size:11px;font-weight:700}.section-pill .vlan{fill:#58a6ff}.leader{fill:none;stroke-width:2}.leader-blue{stroke:#58a6ff}.leader-yellow{stroke:#ffbd2e}.leader-green{stroke:#7ee787}.leader-purple{stroke:#bc8cff}.leader-red{stroke:#ff6b6b}
</style>

<svg viewBox="0 0 1600 760" class="mfg-svg" xmlns="http://www.w3.org/2000/svg">

<rect class="status-panel" x="20" y="15" width="1560" height="65" rx="8"/><circle class="status-ok" cx="45" cy="47" r="9"/><text class="mfg-subtitle" x="62" y="52">SYSTEM ONLINE</text><text class="mfg-title" x="800" y="45" text-anchor="middle">MANUFACTURING OPERATIONS</text><text class="mfg-subtitle" x="800" y="65" text-anchor="middle">PRODUCTION LINE MONITORING</text>

<path class="eq-pipe" d="M20 285H90M250 285H330M520 285H600M790 285H870M1060 285H1135M1370 285H1560"/><path class="eq-pipe-flow" d="M20 285H90M250 285H330M520 285H600M790 285H870M1060 285H1135M1370 285H1560"/><polygon points="18,278 32,285 18,292" fill="#58a6ff"/><text x="20" y="265" fill="#58a6ff" font-size="11" font-weight="800">MATERIAL IN</text><polygon points="1548,278 1562,285 1548,292" fill="#7ee787"/><text x="1450" y="265" fill="#7ee787" font-size="11" font-weight="800">FINISHED PRODUCT</text>

<!-- Conveyor -->
<rect class="eq-body" x="90" y="225" width="160" height="120" rx="6"/><rect class="eq-fill" x="105" y="250" width="130" height="55" rx="4"/>
{% for x in [120,145,170,195,220] %}<circle cx="{{ x }}" cy="278" r="9" fill="#9fb1c7" opacity=".55"/>{% endfor %}
<text class="eq-label" x="170" y="370">CONVEYOR</text>

<!-- Robot -->
<rect class="eq-body" x="330" y="205" width="190" height="160" rx="6"/><rect class="robot-fill" x="365" y="235" width="120" height="100" rx="5"/><circle cx="425" cy="320" r="22" fill="#263348" stroke="#d1d5db" stroke-width="2"/><line x1="425" y1="310" x2="425" y2="270" stroke="#d1d5db" stroke-width="8"/><line x1="425" y1="270" x2="460" y2="248" stroke="#d1d5db" stroke-width="8"/><circle cx="460" cy="248" r="7" fill="#58a6ff"/><text class="eq-label" x="425" y="390">ROBOT CELL</text>

<!-- Packaging -->
<rect class="eq-body" x="600" y="225" width="190" height="120" rx="6"/><rect class="package-fill" x="625" y="250" width="140" height="55" rx="4"/><rect x="650" y="260" width="42" height="32" fill="#d6b36a" stroke="#f8fafc"/><rect x="705" y="260" width="42" height="32" fill="#d6b36a" stroke="#f8fafc"/><text class="eq-label" x="695" y="370">PACKAGING</text>

<!-- Quality -->
<rect class="eq-body" x="870" y="205" width="190" height="160" rx="6"/><rect class="quality-fill" x="900" y="235" width="130" height="100" rx="5"/><rect x="945" y="248" width="42" height="28" rx="4" fill="#263348" stroke="#d1d5db" stroke-width="2"/><circle cx="966" cy="262" r="8" fill="#111827" stroke="#58a6ff" stroke-width="2"/><line x1="966" y1="276" x2="966" y2="315" stroke="#58a6ff" stroke-width="3" stroke-dasharray="5 5"/><text class="eq-label" x="965" y="390">QUALITY</text>

<!-- Finished goods -->
<rect class="eq-body" x="1135" y="225" width="235" height="120" rx="6"/><rect class="eq-fill" x="1160" y="250" width="185" height="55" rx="4"/>
{% for x in [1185,1245,1305] %}<rect x="{{ x }}" y="260" width="42" height="32" fill="#d6b36a" stroke="#f8fafc"/>{% endfor %}
<text class="eq-label" x="1252" y="370">FINISHED GOODS</text>

<!-- VLANs -->
<g class="section-pill"><rect x="95" y="410" width="150" height="25" rx="4"/><text class="vlan" x="108" y="427">VLAN 10</text><text x="168" y="427">CONVEYOR</text></g>
<g class="section-pill"><rect x="345" y="410" width="170" height="25" rx="4"/><text class="vlan" x="358" y="427">VLAN 20</text><text x="418" y="427">ROBOT CELL</text></g>
<g class="section-pill"><rect x="615" y="410" width="160" height="25" rx="4"/><text class="vlan" x="628" y="427">VLAN 30</text><text x="688" y="427">PACKAGING</text></g>
<g class="section-pill"><rect x="885" y="410" width="155" height="25" rx="4"/><text class="vlan" x="898" y="427">VLAN 40</text><text x="958" y="427">QUALITY</text></g>

<!-- Sensors -->
{{ sensor('SPEED-101','CONVEYOR SPEED','rpm',20,465,145,'M92 465V440H135V250','leader-blue') }}
{{ sensor('PROX-101','PROXIMITY','',175,465,145,'M247 465V440H170V278','leader-yellow') }}
{{ sensor('TEMP-101','MOTOR TEMP','C',330,465,145,'M402 465V440H220V250','leader-purple') }}
{{ sensor('JAM-101','JAM STATUS','',485,465,145,'M557 465V440H235V305','leader-red') }}

{{ sensor('POS-201','ROBOT POSITION','mm',655,465,145,'M727 465V440H390V270','leader-blue') }}
{{ sensor('PROX-201','PROXIMITY','',810,465,145,'M882 465V440H460V248','leader-yellow') }}
{{ sensor('TEMP-201','ROBOT TEMP','C',965,465,145,'M1037 465V440H485V320','leader-purple') }}
{{ sensor('TORQUE-201','ROBOT TORQUE','Nm',1120,465,145,'M1192 465V440H425V320','leader-green') }}

{{ sensor('COUNT-301','PRODUCTION COUNT','units/min',1275,465,145,'M1347 465V440H650V260','leader-blue') }}
{{ sensor('WEIGHT-301','PACKAGE WEIGHT','kg',1430,465,145,'M1502 465V440H705V260','leader-green') }}
{{ sensor('TEMP-301','PACKAGING TEMP','C',20,550,145,'M92 550V535H765V305','leader-purple') }}
{{ sensor('SEAL-301','SEAL STATUS','',175,550,145,'M247 550V535H747V292','leader-red') }}

{{ sensor('CAM-401','VISION SCORE','',330,550,145,'M402 550V535H966V248','leader-blue') }}
{{ sensor('REJECT-401','REJECT COUNT','',485,550,145,'M557 550V535H900V315','leader-red') }}
{{ sensor('VIB-401','VIBRATION','mm/s',655,550,145,'M727 550V535H1030V315','leader-purple') }}
{{ sensor('TEMP-401','QUALITY TEMP','C',810,550,145,'M882 550V535H1030V335','leader-purple') }}

<!-- Status -->
<rect class="status-panel" x="20" y="640" width="1560" height="100" rx="8"/><text class="mfg-title" x="800" y="670" text-anchor="middle" font-size="18">MANUFACTURING CONTROL STATUS</text><text class="mfg-subtitle" x="180" y="705" text-anchor="middle">CONVEYOR: ONLINE</text><text class="mfg-subtitle" x="520" y="705" text-anchor="middle">ROBOT CELL: ONLINE</text><text class="mfg-subtitle" x="900" y="705" text-anchor="middle">PACKAGING: ONLINE</text><text class="mfg-subtitle" x="1280" y="705" text-anchor="middle">QUALITY: ONLINE</text>

</svg>
{% endblock %}
